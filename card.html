<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacto Misr | Digital Business Card</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>body{background:#0c172a;color:#e9f5ff;font-family:Arial,sans-serif;margin:0;padding:22px}main{max-width:550px;margin:30px auto}.card{direction:ltr;background:#f8fcff;color:#1c6097;border-radius:22px;overflow:hidden;box-shadow:0 15px 45px #0006;aspect-ratio:1.78;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.card h1{font-size:clamp(18px,5vw,29px);margin:5px 0}.card h2{font-size:clamp(12px,3vw,19px);margin:4px 0}.card p{font-size:clamp(10px,2.5vw,14px);margin:3px 0;overflow-wrap:anywhere}.head{display:flex;justify-content:space-between;align-items:center}.head img{width:64px;height:55px;object-fit:contain}.back{padding:0;background:#e7f4ff}.back img{height:73%;width:100%;object-fit:cover}.back p{text-align:center;padding:5px}button{background:#1886c9;color:white;border:0;border-radius:12px;padding:14px;cursor:pointer;font-weight:700;margin:7px 5px 0 0}#status{line-height:1.8;text-align:center}#actions{display:none}</style></head><body><main><p id="status">جارٍ تحميل بطاقة التواصل العامة...</p><div id="card" class="card" style="display:none"><div><div class="head"><strong>LACTO MISR S.A.E</strong><img src="logo.png" alt="Lacto Misr"></div><h1 id="nm"></h1><h2 id="job"></h2></div><div><p>☎ <span id="phone"></span></p><p>✉ <span id="email"></span></p><p>⌖ Industrial Zone H6 No. 131, 10th of Ramadan</p></div></div><div id="back" class="card back" style="display:none"><img src="factory_reference.jpg" alt="Lacto Misr Factory"><p><strong>LACTO MISR · www.lactomisr.com</strong><br>Tel: (+2055) 44 11 776 - 777<br>Fax: (+2055) 44 11 774</p></div><div id="actions"><button onclick="flip()">🔄 قلب الكارت / Flip</button><button onclick="download()">⬇️ تحميل PNG</button><button onclick="contact()">📱 حفظ جهة اتصال</button></div><p style="font-size:12px;color:#a7bdd2">بطاقة تواصل عامة، وليست إثبات هوية رسميًا. / Public contact card, not an official ID.</p></main><script>
// Public cards contain approved contact information only. Do NOT point to /users.
const cfg={apiKey:"AIzaSyBObCeo4PM20UNYObThwdY4UaOiIhWdXa0",authDomain:"lacto-hr-system.firebaseapp.com",databaseURL:"https://lacto-hr-system-default-rtdb.firebaseio.com",projectId:"lacto-hr-system"};
firebase.initializeApp(cfg);let data=null;const code=new URLSearchParams(location.search).get('code');
const el=id=>document.getElementById(id);const set=(id,val)=>el(id).textContent=val||'—';
if(!code||!/^[0-9]{1,12}$/.test(code)){el('status').textContent='رابط البطاقة غير صالح';}else firebase.database().ref('public_cards/'+code).once('value').then(s=>{data=s.val();if(!data||data.active!==true){el('status').textContent='هذه البطاقة غير منشورة بعد. يرجى التواصل مع إدارة الموارد البشرية.';return}set('nm',data.name);set('job',data.jobTitle);set('phone',data.phone);set('email',data.email);el('card').style.display='flex';el('actions').style.display='block';el('status').style.display='none'}).catch(e=>{el('status').textContent='تعذر تحميل البطاقة: '+e.message});
function flip(){let a=el('card'),b=el('back');let show=a.style.display!=='none';a.style.display=show?'none':'flex';b.style.display=show?'flex':'none'}
async function download(){try{let c=await html2canvas(el('card').style.display==='none'?el('back'):el('card'),{backgroundColor:'#fff',scale:3,useCORS:true});let a=document.createElement('a');a.download='Lacto_Misr_'+code+'.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('تعذر تحميل الصورة: '+e.message)}}
function contact(){if(!data)return;let esc=v=>String(v||'').split('\\').join('\\\\').split(',').join('\\,').split(';').join('\\;').split(String.fromCharCode(10)).join('\\n');let v=['BEGIN:VCARD','VERSION:3.0','FN:'+esc(data.name),'ORG:Lacto Misr','TITLE:'+esc(data.jobTitle),'TEL;TYPE=WORK:'+esc(data.phone),'EMAIL;TYPE=WORK:'+esc(data.email),'URL:https://www.lactomisr.com','END:VCARD'].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard;charset=utf-8'}));a.download='Lacto_Misr_'+code+'.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
