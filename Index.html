<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacto Misr HR System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .title { text-align: center; color: #0369a1; font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; outline: none; }
        .btn { width: 100%; background: #0284c7; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #0369a1; }
        .hidden { display: none !important; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.75rem; margin-bottom: 1rem; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding: 0.5rem 0; font-size: 0.875rem; }
        .panel { margin-top: 1.5rem; background: #fffbeb; border: 1px solid #fef3c7; padding: 1rem; border-radius: 0.5rem; }
        .logout-btn { background: transparent; border: 1px solid #fca5a5; color: #ef4444; padding: 0.25rem 0.5rem; border-radius: 0.375rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- كارت الدخول -->
    <div id="loginCard" class="card">
        <h2 class="title">Lacto Misr HR</h2>
        <div class="input-group">
            <label>كود الموظف</label>
            <input type="text" id="empId" placeholder="جرب كود: 102 أو 2 أو 999">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" value="123456">
        </div>
        <button onclick="login()" class="btn">تسجيل الدخول</button>
    </div>

    <!-- لوحة الموظف -->
    <div id="dashboard" class="card hidden">
        <div class="header">
            <div>
                <h3 id="userName" style="font-size: 1.1rem;"></h3>
                <span id="userRole" class="badge"></span>
            </div>
            <button onclick="logout()" class="logout-btn">خروج</button>
        </div>

        <div class="info-row"><span>الوظيفة:</span> <b id="userJob"></b></div>
        <div class="info-row"><span>الإدارة:</span> <b id="userDept"></b></div>
        <div class="info-row"><span>الحالة:</span> <b id="userStatus" style="color: #16a34a;"></b></div>

        <div id="managerPanel" class="panel hidden">
            <h4 style="color: #b45309; margin-bottom: 0.5rem;">لوحة المدير المسؤول</h4>
            <p style="font-size: 0.75rem; color: #78350f;">متاح لك مراجعة طلبات الإجازات وفريق العمل.</p>
        </div>
    </div>

    <script>
        const mockUsers = {
            "102": { name: "مجدي موريس جميل", job: "عامل بوفية", dept: "الشئون الإدارية", role: "Employee", status: "Active" },
            "2": { name: "أ/ أمجد عبدالمؤمن محمد", job: "المدير التجاري", dept: "الإدارة المالية", role: "Manager", status: "Active" },
            "999": { name: "موظف مستقيل", job: "سائق", dept: "الإنتاج", role: "Employee", status: "Resigned" }
        };

        function login() {
            const id = document.getElementById("empId").value.trim();
            const user = mockUsers[id];

            if (!user) { alert("كود الموظف غير موجود!"); return; }
            if (user.status === "Resigned" || user.status === "Inactive") {
                alert("عفواً، تم سحب صلاحية هذا الحساب!");
                return;
            }

            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");

            document.getElementById("userName").innerText = user.name;
            document.getElementById("userRole").innerText = user.role === "Manager" ? "مدير" : "موظف";
            document.getElementById("userJob").innerText = user.job;
            document.getElementById("userDept").innerText = user.dept;
            document.getElementById("userStatus").innerText = user.status;

            if (user.role === "Manager") {
                document.getElementById("managerPanel").classList.remove("hidden");
            } else {
                document.getElementById("managerPanel").classList.add("hidden");
            }
        }

        function logout() {
            document.getElementById("dashboard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
