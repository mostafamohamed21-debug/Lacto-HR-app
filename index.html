<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&family=Share+Tech+Mono&display=swap');
    :root {
      --bg: #0b0f19; --card-bg: rgba(15, 23, 42, 0.82); --border-color: rgba(255, 255, 255, 0.16);
      --text: #f8fafc; --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444; --success: #10b981; --muted: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    html { background-color: #0b0f19; height: 100%; }
    body { background: linear-gradient(rgba(11, 15, 25, 0.82), rgba(11, 15, 25, 0.92)), url('background.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 4.5rem 1rem 6rem 1rem; overflow-x: hidden; }
    
    /* ظبط اتجاه النصوص مع تغيير اللغة */
    [dir="ltr"] { text-align: left !important; }
    [dir="ltr"] input, [dir="ltr"] textarea, [dir="ltr"] select, [dir="ltr"] .dropdown-selected, [dir="ltr"] .info-grid, [dir="ltr"] .accordion-item, [dir="ltr"] .dynamic-form-block { text-align: left !important; }
    [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select, [dir="rtl"] .dropdown-selected, [dir="rtl"] .info-grid, [dir="rtl"] .accordion-item, [dir="rtl"] .dynamic-form-block { text-align: right !important; }
    [dir="ltr"] .profile-text-content { text-align: left; } [dir="rtl"] .profile-text-content { text-align: right; }

    #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0f19; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1.2s; }
    #intro-screen.fade-out { opacity: 0; visibility: hidden; }
    .intro-title-container { display: flex; gap: 0.15rem; font-size: 1.8rem; font-weight: 800; color: #38bdf8; direction: ltr; }
    
    .app-header { width: 100vw; background: #0d1527; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: #38bdf8; }
    .header-tools { display: flex; gap: 0.8rem; }
    .lang-dropdown-btn { background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-color); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    .lang-dropdown-menu { position: absolute; top: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: 1rem; display: none; z-index: 300; }
    .lang-dropdown-menu.show { display: block; }
    .lang-option { padding: 0.7rem 1rem; cursor: pointer; color: var(--text); } .lang-option:hover { color: #38bdf8; }
    
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 1.5rem; border-radius: 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
    
    input, textarea, select { width: 100%; padding: 0.9rem 1rem; margin: 0.5rem 0; border-radius: 1rem; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.85); color: var(--text); font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #38bdf8; }
    .readonly-input { background: rgba(30,41,59,0.7) !important; color: #94a3b8 !important; cursor: not-allowed; border-style: dashed !important; }
    .custom-date-input { background: rgba(56, 189, 248, 0.08) !important; border: 1px solid rgba(56, 189, 248, 0.5) !important; color: #38bdf8 !important; font-weight: 700 !important; cursor: pointer; text-align: center !important; }

    button.btn-success { width: 100%; padding: 0.95rem; border-radius: 1.25rem; border: 1px solid rgba(56, 189, 248, 0.5); background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%); color: #fff; font-weight: 700; cursor: pointer; margin-top: 0.85rem; }
    button.btn-danger { width: 100%; padding: 0.95rem; border-radius: 1.25rem; background: linear-gradient(135deg, rgba(239, 68, 68, 0.85), rgba(153, 27, 27, 0.85)); color: #fff; border: none; font-weight: 700; cursor: pointer; margin-top: 0.85rem; }
    .hidden { display: none !important; }
    
    .user-profile-card { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(56, 189, 248, 0.35); border-radius: 0 0 1.75rem 1.75rem; padding: 1.15rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .profile-info-group { display: flex; align-items: center; gap: 0.85rem; justify-content: center; }
    .header-avatar, .profile-img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; background: #0f172a; }
    .profile-img { width: 95px; height: 95px; margin: 0 auto; display: block; }
    
    .accordion-item { background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border-color); border-radius: 1rem; margin-bottom: 0.75rem; overflow: hidden; }
    .accordion-header { padding: 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; background: rgba(56, 189, 248, 0.1); border-bottom: 1px solid transparent; transition: background 0.3s; }
    .accordion-header:hover { background: rgba(56, 189, 248, 0.2); }
    .accordion-content { max-height: 0; overflow: hidden; padding: 0 1rem; transition: all 0.4s ease; opacity: 0; }
    .accordion-item.active .accordion-header { border-bottom-color: rgba(56, 189, 248, 0.3); }
    .accordion-item.active .accordion-content { padding: 1rem; max-height: 2500px; opacity: 1; }
    .accordion-arrow { transition: transform 0.3s ease; color: #38bdf8; }
    .accordion-item.active .accordion-arrow { transform: rotate(180deg); }
    
    .dynamic-form-block { background: rgba(56, 189, 248, 0.05); border: 1px dashed rgba(56, 189, 248, 0.4); padding: 0.85rem; border-radius: 0.85rem; margin-bottom: 0.75rem; }
    .dynamic-form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.8rem; color: #38bdf8; font-weight: bold; }
    .remove-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .add-outline-btn { background: transparent; border: 1px dashed #38bdf8; color: #38bdf8; padding: 0.6rem; border-radius: 0.85rem; cursor: pointer; width: 100%; font-weight: bold; margin-top:0.5rem; }
    .add-outline-btn:hover { background: rgba(56, 189, 248, 0.1); }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; width: 100%; }
    .back-btn { background: rgba(51, 65, 85, 0.9); border: 1px solid var(--border-color); padding: 0.5rem 1.1rem; border-radius: 0.8rem; cursor: pointer; color: var(--text); }
    
    #bottomNavBar { position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(15, 23, 42, 0.98); border-top: 1px solid rgba(56, 189, 248, 0.4); display: none; justify-content: space-around; padding: 0.6rem 0.55rem; z-index: 99998; }
    #bottomNavBar.show { display: flex; }
    .bottom-nav-item { background: transparent; border: none; cursor: pointer; color: #7dd3fc; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; font-size: 0.7rem; font-weight: 700; }
    .bottom-nav-item.active { color: #38bdf8; }
    .bottom-nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    /* Calendar Modal */
    .calendar-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 15, 25, 0.85); display: none; justify-content: center; align-items: center; z-index: 20000; }
    .calendar-modal-overlay.show { display: flex; }
    .calendar-box { background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 1.5rem; padding: 1.5rem; width: 90%; max-width: 350px; text-align: center; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; color: #38bdf8; font-weight: bold; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; margin-bottom: 1rem; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; border-radius: 50%; cursor: pointer; }
    .calendar-day.selected { background: #38bdf8; color: #0b0f19; }
  </style>
</head>
<body>
  <!-- Intro Screen -->
  <div id="intro-screen">
    <div class="intro-title-container" id="introTitle">LACTO MISR S.A.E</div>
  </div>
  
  <!-- App Header -->
  <div class="app-header">
    <div class="brand-title">LM HR</div>
    <div class="header-tools">
      <div style="position: relative;">
        <button class="lang-dropdown-btn" onclick="document.getElementById('langMenu').classList.toggle('show')">
          🌐 <span id="current-lang-short">AR</span> ▼
        </button>
        <div class="lang-dropdown-menu" id="langMenu">
          <div class="lang-option" onclick="selectLanguage('ar')">🇪🇬 AR</div>
          <div class="lang-option" onclick="selectLanguage('en')">🇬🇧 EN</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 1. Login View -->
    <div id="view-login" class="card">
      <h2>LM HR Hub</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;" data-ar="بوابة الموظفين الرقمية" data-en="Digital Employee Portal">بوابة الموظفين الرقمية</p>
      <input type="text" id="empCode" data-ar-placeholder="كود الموظف" data-en-placeholder="Employee Code" placeholder="كود الموظف">
      <input type="password" id="empPass" data-ar-placeholder="كلمة السر" data-en-placeholder="Password" placeholder="كلمة السر">
      <button class="btn-success" onclick="login()" data-ar="دخول الحساب" data-en="Sign In">دخول الحساب</button>
    </div>
    
    <!-- 2. Dashboard Header -->
    <div id="dashboard-header-container" class="hidden">
      <div class="user-profile-card">
        <div class="profile-info-group">
          <img id="dash-avatar" class="header-avatar" src="logo.png" alt="Avatar">
          <div class="profile-text-content">
            <h3 id="dash-name">مصطفى السيد</h3>
            <div style="color: #38bdf8; font-size: 0.8rem;">ID: <span id="dash-code-val">10024</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div id="view-dashboard" class="hidden card" style="margin-top:1rem;">
      <h3 data-ar="مرحباً بك في لوحة التحكم" data-en="Welcome to Dashboard">مرحباً بك في لوحة التحكم</h3>
      <p style="color:var(--muted); font-size:0.85rem; margin-top:0.5rem;" data-ar="الخدمات تعمل بكفاءة." data-en="Services running smoothly.">الخدمات تعمل بكفاءة.</p>
    </div>

    <!-- 6. Profile View (الموديول الجديد) -->
    <div id="view-profile" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')"><span data-ar="← رجوع" data-en="← Back">← رجوع</span></button>
        <span style="font-weight: 700; color: #38bdf8;" data-ar="الملف الشخصي" data-en="My Profile">الملف الشخصي</span>
      </div>
      
      <!-- تغيير الصورة الشخصية -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img id="profileViewAvatar" src="logo.png" class="profile-img" style="cursor:pointer;" onclick="document.getElementById('avatarUpload').click()" title="تغيير الصورة">
        <input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="handleAvatarUpload(this)">
        <div style="font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem;" data-ar="اضغط على الصورة لتغييرها" data-en="Tap image to change">اضغط على الصورة لتغييرها</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <!-- القسم الأول: البيانات الشخصية -->
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span data-ar="👤 البيانات الشخصية" data-en="👤 Personal Data">👤 البيانات الشخصية</span>
            <span class="accordion-arrow">▼</span>
          </div>
          <div class="accordion-content">
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="الرقم القومي (غير قابل للتعديل):" data-en="National ID (Read-only):">الرقم القومي (غير قابل للتعديل):</label>
            <input type="text" id="profNID" class="readonly-input" value="28801011234567" readonly>
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="تاريخ الإصدار:" data-en="Issue Date:">تاريخ الإصدار:</label>
            <input type="text" id="profIssueDate" class="custom-date-input" readonly data-ar-placeholder="اختر تاريخ الإصدار..." data-en-placeholder="Select issue date..." placeholder="اختر تاريخ الإصدار..." onclick="openCustomCalendar('profIssueDate')">
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="العنوان:" data-en="Address:">العنوان:</label>
            <input type="text" id="profAddress" data-ar-placeholder="أدخل العنوان..." data-en-placeholder="Enter address..." placeholder="أدخل العنوان...">
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="رقم التليفون:" data-en="Phone Number:">رقم التليفون:</label>
            <input type="text" id="profPhone" data-ar-placeholder="أدخل رقم الهاتف..." data-en-placeholder="Enter phone..." placeholder="أدخل رقم الهاتف...">
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="رقم الطوارئ:" data-en="Emergency Phone:">رقم الطوارئ:</label>
            <input type="text" id="profEmergPhone" data-ar-placeholder="أدخل رقم الطوارئ..." data-en-placeholder="Enter emergency phone..." placeholder="أدخل رقم الطوارئ...">
            <label style="font-size: 0.75rem; color: var(--muted);" data-ar="الحالة الاجتماعية:" data-en="Marital Status:">الحالة الاجتماعية:</label>
            <select id="profMarital" style="color: var(--text);">
              <option value="single" data-ar="أعزب" data-en="Single">أعزب</option>
              <option value="married" data-ar="متزوج" data-en="Married">متزوج</option>
            </select>
          </div>
        </div>

        <!-- القسم الثاني: المؤهل العلمي -->
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span data-ar="🎓 بيانات المؤهل العلمي" data-en="🎓 Education">🎓 بيانات المؤهل العلمي</span>
            <span class="accordion-arrow">▼</span>
          </div>
          <div class="accordion-content">
            <div class="dynamic-form-block" style="border-color: rgba(255,255,255,0.1); background: rgba(30,41,59,0.3);">
              <div class="dynamic-form-header" style="color: var(--muted);">
                 <span data-ar="المؤهل الأساسي" data-en="Primary Qualification">المؤهل الأساسي</span> <span>🔒</span>
              </div>
              <input type="text" class="readonly-input" value="بكالوريوس تجارة" readonly>
              <input type="text" class="readonly-input" value="جامعة القاهرة" readonly>
              <input type="text" class="readonly-input" value="2010-07-01" readonly>
            </div>
            <div id="dynamicEducationContainer"></div>
            <button class="add-outline-btn" onclick="addEducationForm()" data-ar="➕ إضافة مؤهل علمي جديد" data-en="➕ Add New Qualification">➕ إضافة مؤهل علمي جديد</button>
          </div>
        </div>

        <!-- القسم الثالث: الدورات التدريبية -->
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span data-ar="🎖️ الدورات التدريبية" data-en="🎖️ Training Courses">🎖️ الدورات التدريبية</span>
            <span class="accordion-arrow">▼</span>
          </div>
          <div class="accordion-content">
            <div class="dynamic-form-block" style="border-color: rgba(255,255,255,0.1); background: rgba(30,41,59,0.3);">
              <div class="dynamic-form-header" style="color: var(--muted);">
                 <span data-ar="دورة معتمدة" data-en="Certified Course">دورة معتمدة</span> <span>🔒</span>
              </div>
              <input type="text" class="readonly-input" value="Peachtree Certificate" readonly>
              <input type="text" class="readonly-input" value="AUC" readonly>
              <input type="text" class="readonly-input" value="3 شهور" readonly>
            </div>
            <div id="dynamicCoursesContainer"></div>
            <button class="add-outline-btn" onclick="addCourseForm()" data-ar="➕ إضافة دورة تدريبية جديدة" data-en="➕ Add New Course">➕ إضافة دورة تدريبية جديدة</button>
          </div>
        </div>

        <button onclick="submitProfileUpdate()" class="btn-success" data-ar="حفظ وتحديث البيانات" data-en="Save & Update Data">حفظ وتحديث البيانات</button>
        <p id="profileMsg" style="font-size: 0.8rem; margin-top: 0.5rem; color: #10b981; font-weight: bold;"></p>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div id="bottomNavBar">
    <button class="bottom-nav-item active" onclick="showPage('view-dashboard')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-ar="الرئيسية" data-en="Home">الرئيسية</span>
    </button>
    <button class="bottom-nav-item" onclick="showPage('view-profile')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span data-ar="الملف" data-en="Profile">الملف</span>
    </button>
  </div>

  <!-- Custom Calendar -->
  <div id="customCalendarModal" class="calendar-modal-overlay" onclick="closeCustomCalendar()">
    <div class="calendar-box" onclick="event.stopPropagation()">
      <div class="calendar-header">
        <button onclick="changeCalendarMonth(-1)" style="background:none; border:none; color:#38bdf8; font-size:1.5rem; cursor:pointer;">❮</button>
        <div id="calMonthYearTitle">سبتمبر 2026</div>
        <button onclick="changeCalendarMonth(1)" style="background:none; border:none; color:#38bdf8; font-size:1.5rem; cursor:pointer;">❯</button>
      </div>
      <div class="calendar-grid" id="calendarDaysGrid"></div>
      <button onclick="confirmCustomCalendar()" class="btn-success" style="padding:0.5rem; font-size:0.9rem;" data-ar="تأكيد" data-en="OK">تأكيد</button>
    </div>
  </div>

  <script>
    setTimeout(() => { document.getElementById('intro-screen').classList.add('fade-out'); }, 1500);

    let currentLang = 'ar';
    function selectLanguage(lang) {
      currentLang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      document.getElementById('current-lang-short').innerText = lang.toUpperCase();
      document.getElementById('langMenu').classList.remove('show');
      updateTranslations();
    }

    function updateTranslations() {
      document.querySelectorAll('[data-ar]').forEach(el => {
        if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          if(el.hasAttribute('data-ar-placeholder')) el.placeholder = el.getAttribute(`data-${currentLang}-placeholder`);
        } else if (el.tagName === 'OPTION') {
          el.text = el.getAttribute(`data-${currentLang}`);
        } else {
          el.innerText = el.getAttribute(`data-${currentLang}`);
        }
      });
    }

    function login() { showPage('view-dashboard'); }

    function showPage(pageId) {
      document.querySelectorAll('.card, #dashboard-header-container').forEach(el => el.classList.add('hidden'));
      if(pageId !== 'view-login') {
        document.getElementById('dashboard-header-container').classList.remove('hidden');
        document.getElementById('bottomNavBar').classList.add('show');
      }
      document.getElementById(pageId).classList.remove('hidden');
      
      // تفريغ إضافات البروفايل لما ندخله من جديد
      if(pageId === 'view-profile') resetProfileForm();
    }

    // --- سكربت البروفايل (Accordion و Dynamic Fields) ---
    function toggleAccordion(element) {
      const item = element.parentElement;
      item.classList.toggle('active');
    }

    function handleAvatarUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgData = e.target.result;
          localStorage.setItem('lacto_avatar', imgData);
          document.getElementById('profileViewAvatar').src = imgData;
          document.getElementById('dash-avatar').src = imgData;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    let eduCount = 0;
    function addEducationForm() {
      eduCount++;
      const dateId = 'eduDate_' + eduCount;
      const html = `
      <div class="dynamic-form-block" id="eduBlock_${eduCount}">
        <div class="dynamic-form-header">
          <span data-ar="مؤهل علمي إضافي" data-en="Additional Education">مؤهل علمي إضافي</span>
          <button class="remove-btn" onclick="document.getElementById('eduBlock_${eduCount}').remove()">✕</button>
        </div>
        <input type="text" data-ar-placeholder="اسم المؤهل..." data-en-placeholder="Degree Name..." placeholder="اسم المؤهل...">
        <input type="text" data-ar-placeholder="الجهة المانحة..." data-en-placeholder="Institution..." placeholder="الجهة المانحة...">
        <input type="text" id="${dateId}" class="custom-date-input" readonly data-ar-placeholder="تاريخ الحصول عليه..." data-en-placeholder="Date..." placeholder="تاريخ الحصول عليه..." onclick="openCustomCalendar('${dateId}')">
      </div>`;
      document.getElementById('dynamicEducationContainer').insertAdjacentHTML('beforeend', html);
      updateTranslations();
    }

    let courseCount = 0;
    function addCourseForm() {
      courseCount++;
      const dateId = 'courseDate_' + courseCount;
      const html = `
      <div class="dynamic-form-block" id="courseBlock_${courseCount}">
        <div class="dynamic-form-header">
          <span data-ar="دورة تدريبية إضافية" data-en="Additional Course">دورة تدريبية إضافية</span>
          <button class="remove-btn" onclick="document.getElementById('courseBlock_${courseCount}').remove()">✕</button>
        </div>
        <input type="text" data-ar-placeholder="اسم الدورة..." data-en-placeholder="Course Name..." placeholder="اسم الدورة...">
        <input type="text" data-ar-placeholder="مدة الدورة..." data-en-placeholder="Duration..." placeholder="مدة الدورة...">
        <input type="text" data-ar-placeholder="الجهة المانحة..." data-en-placeholder="Institution..." placeholder="الجهة المانحة...">
        <input type="text" id="${dateId}" class="custom-date-input" readonly data-ar-placeholder="تاريخ الحصول عليها..." data-en-placeholder="Date..." placeholder="تاريخ الحصول عليها..." onclick="openCustomCalendar('${dateId}')">
      </div>`;
      document.getElementById('dynamicCoursesContainer').insertAdjacentHTML('beforeend', html);
      updateTranslations();
    }

    function resetProfileForm() {
      document.getElementById('dynamicEducationContainer').innerHTML = '';
      document.getElementById('dynamicCoursesContainer').innerHTML = '';
      document.querySelectorAll('.accordion-item').forEach(item => item.classList.remove('active'));
      const savedAvatar = localStorage.getItem('lacto_avatar');
      if(savedAvatar) {
         document.getElementById('profileViewAvatar').src = savedAvatar;
         document.getElementById('dash-avatar').src = savedAvatar;
      }
    }

    function submitProfileUpdate() {
      const msg = document.getElementById('profileMsg');
      msg.innerText = currentLang === 'ar' ? '✅ تم تحديث بياناتك بنجاح!' : '✅ Profile updated successfully!';
      setTimeout(() => msg.innerText = '', 3000);
    }

    // --- سكربت النتيجة (Calendar) ---
    let activeDateInputId = null; let tempSelectedDate = ""; let calMonth = 8; let calYear = 2026;
    function openCustomCalendar(inputId) {
      activeDateInputId = inputId; tempSelectedDate = document.getElementById(inputId).value;
      renderCalendar(); document.getElementById('customCalendarModal').classList.add('show');
    }
    function renderCalendar() {
      document.getElementById('calMonthYearTitle').innerText = `${calYear} - ${calMonth + 1}`;
      const grid = document.getElementById('calendarDaysGrid'); grid.innerHTML = "";
      for (let day = 1; day <= 30; day++) {
        const dayCell = document.createElement('div'); dayCell.className = 'calendar-day'; dayCell.innerText = day;
        const fDate = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(fDate === tempSelectedDate) dayCell.classList.add('selected');
        dayCell.onclick = () => { grid.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected')); dayCell.classList.add('selected'); tempSelectedDate = fDate; };
        grid.appendChild(dayCell);
      }
    }
    function changeCalendarMonth(dir) { calMonth += dir; renderCalendar(); }
    function closeCustomCalendar() { document.getElementById('customCalendarModal').classList.remove('show'); }
    function confirmCustomCalendar() { if (activeDateInputId && tempSelectedDate) document.getElementById(activeDateInputId).value = tempSelectedDate; closeCustomCalendar(); }

    window.onload = () => { selectLanguage('ar'); }
  </script>
</body>
</html>
