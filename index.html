<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="logo.png">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&family=Share+Tech+Mono&display=swap');
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.82);
      --border-color: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --success: #10b981;
      --muted: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html { background-color: #0b0f19; height: 100%; }
    body {
      background: linear-gradient(rgba(11, 15, 25, 0.82), rgba(11, 15, 25, 0.92));
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4.5rem 1rem 6rem 1rem;
      overflow-x: hidden;
      direction: rtl;
    }
    
    .app-header {
      width: 100vw; background: #0d1527; padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .brand-container { display: flex; align-items: center; gap: 0.6rem; }
    .brand-title {
      font-size: 1.2rem; font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 1.75rem 1.5rem; border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); text-align: center;
    }
    input, textarea, select {
      width: 100%; padding: 0.9rem 1rem; margin: 0.5rem 0; border-radius: 1rem;
      border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.85);
      color: var(--text); font-size: 0.95rem; text-align: right; outline: none;
    }
    button {
      width: 100%; padding: 0.95rem; border-radius: 1.25rem; border: 1px solid rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      color: #ffffff; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 0.85rem;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
    }
    .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); border-color: rgba(239, 68, 68, 0.6); }
    .hidden { display: none !important; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; width: 100%; }
    .back-btn { 
      background: rgba(51, 65, 85, 0.9); border: 1px solid var(--border-color); width: auto !important; 
      padding: 0.5rem 1.1rem !important; font-size: 0.85rem !important; font-weight: 700;
      margin: 0 !important; border-radius: 0.8rem; cursor: pointer; color: var(--text);
    }
    
    .service-row-btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 1.25rem;
      padding: 1.1rem 1.25rem; color: var(--text); font-weight: 700; font-size: 0.95rem;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 0.6rem;
    }

    #bottomNavBar {
      position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(15, 23, 42, 0.98);
      border-top: 1px solid rgba(56, 189, 248, 0.4); backdrop-filter: blur(16px);
      display: none; justify-content: space-around; align-items: center; padding: 0.6rem 0.55rem;
      z-index: 99998;
    }
    #bottomNavBar.show { display: flex; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
      background: transparent; border: none; cursor: pointer; color: #7dd3fc; flex: 1;
    }
    .bottom-nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .bottom-nav-item span { font-size: 0.7rem; font-weight: 700; }
    .bottom-nav-item.active { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-container">
      <div class="brand-title">LM HR Hub</div>
    </div>
  </div>

  <div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="view-login" class="card">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.2rem; color: #38bdf8;">تسجيل الدخول</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">بوابة الموظفين الرقمية</p>
      
      <input type="text" id="empCode" placeholder="كود الموظف">
      <input type="password" id="empPass" placeholder="كلمة السر">
      
      <button onclick="login()" class="btn-success">دخول الحساب</button>
      <p id="error" style="color: var(--danger); margin-top: 1rem; font-size: 0.85rem; font-weight: bold;"></p>
    </div>
    
    <!-- لوحة التحكم الرئيسية -->
    <div id="view-dashboard" class="card hidden">
      <h3 id="dash-name" style="color: #38bdf8; font-size: 1.2rem; margin-bottom: 0.3rem;">أهلاً بك</h3>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem;">إدارة موارد بشركة لاكتو مصر</p>

      <button onclick="showPage('view-services')" class="service-row-btn">
        <span>📅 الخدمات والطلبات</span>
        <span style="color: #38bdf8;">➔</span>
      </button>
      <button onclick="showPage('view-id-card')" class="service-row-btn">
        <span>🆔 الكارت الرقمي (ID)</span>
        <span style="color: #38bdf8;">➔</span>
      </button>

      <button onclick="logout()" class="btn-danger" style="margin-top: 1.5rem;">تسجيل الخروج</button>
    </div>

    <!-- شاشة الخدمات -->
    <div id="view-services" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')">← رجوع</button>
        <span style="font-weight: 700; color: #38bdf8;">خدماتي</span>
      </div>
      <button class="service-row-btn" onclick="alert('طلب إجازة')">📅 طلب إجازة</button>
      <button class="service-row-btn" onclick="alert('طلب إذن')">🚪 طلب إذن شخصي</button>
      <button class="service-row-btn" onclick="alert('طلب سلفة')">💳 طلب سلفة مالية</button>
    </div>

    <!-- شاشة الكارت الرقمي -->
    <div id="view-id-card" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')">← رجوع</button>
        <span style="font-weight: 700; color: #38bdf8;">الكارت الرقمي</span>
      </div>
      <h3 id="userName" style="margin: 0.5rem 0;">--</h3>
      <p id="userJob" style="color: #38bdf8; font-size: 0.85rem; margin-bottom: 1rem;">--</p>
      <div id="qrcode" style="background: #fff; padding: 0.75rem; display: inline-block; border-radius: 1rem;"></div>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <div id="bottomNavBar">
    <button class="bottom-nav-item active" onclick="showPage('view-dashboard')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="bottom-nav-item" onclick="showPage('view-services')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>خدماتي</span>
    </button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBObCeo4PM20UNYObThwdY4UaOiIhWdXa0",
      authDomain: "lacto-hr-system.firebaseapp.com",
      databaseURL: "https://lacto-hr-system-default-rtdb.firebaseio.com",
      projectId: "lacto-hr-system"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    function showPage(pageId) {
      ['view-login', 'view-dashboard', 'view-services', 'view-id-card'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      document.getElementById(pageId).classList.remove('hidden');
      
      const bottomNav = document.getElementById('bottomNavBar');
      if (pageId === 'view-login') {
        bottomNav.classList.remove('show');
      } else {
        bottomNav.classList.add('show');
      }
    }

    function login() {
      const code = document.getElementById('empCode').value.trim();
      const pass = document.getElementById('empPass').value.trim();
      const errorEl = document.getElementById('error');

      if (!code || !pass) {
        errorEl.innerText = "يرجى إدخال كود الموظف وكلمة السر";
        return;
      }

      db.ref('users/' + code).once('value').then((snapshot) => {
        if (snapshot.exists()) {
          const user = snapshot.val();
          if (user.password !== pass) {
            errorEl.innerText = "كلمة السر غير صحيحة!";
            return;
          }
          errorEl.innerText = "";
          document.getElementById('dash-name').innerText = "أهلاً بك، " + (user.name || "موظف");
          document.getElementById('userName').innerText = user.name || "--";
          document.getElementById('userJob').innerText = user.job || "--";
          
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById("qrcode"), { text: "EMP-" + code, width: 100, height: 100 });
          
          showPage('view-dashboard');
        } else {
          errorEl.innerText = "كود الموظف غير مسجل!";
        }
      }).catch(err => {
        errorEl.innerText = "خطأ في الاتصال بقاعدة البيانات";
      });
    }

    function logout() {
      document.getElementById('empCode').value = "";
      document.getElementById('empPass').value = "";
      showPage('view-login');
    }
  </script>
</body>
</html>
