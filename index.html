<!-- Real Chatbot Popup Box -->
  <div class="chat-popup hidden" id="chatPopup">
    <div class="chat-header">
      <span id="t-chatTitle">شات الدعم الفني</span>
      <button class="chat-close-btn" onclick="toggleChatPopup()">✕</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="chat-msg bot" id="t-welcomeMsg">أهلاً بك! كيف يمكنني مساعدتك اليوم في نظام الموارد البشرية؟</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatKeyPress(event)">
      <button onclick="sendChatMessage()">إرسال</button>
    </div>
  </div>

  <!-- JavaScript Code Section -->
  <script>
    // تكملة الوظائف البرمجية والتفاعلية للنظام
    function toggleChatPopup() {
      const popup = document.getElementById('chatPopup');
      popup.classList.toggle('hidden');
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const chatBody = document.getElementById('chatBody');
      const text = input.value.trim();
      
      if(!text) return;

      // إضافة رسالة المستخدم
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-msg user';
      userMsg.textContent = text;
      chatBody.appendChild(userMsg);

      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;

      // الرد التلقائي من النظام
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'chat-msg bot';
        botMsg.textContent = 'تم تلقي استفسارك وسيتم الرد عليك من قبل فريق الموارد البشرية قريباً.';
        chatBody.appendChild(botMsg);
        chatBody.scrollTop = chatBody.scrollHeight;
      }, 1000);
    }

    function handleChatKeyPress(e) {
      if(e.key === 'Enter') {
        sendChatMessage();
      }
    }
  </script>
</body>
</html>
