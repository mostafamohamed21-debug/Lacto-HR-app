<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <!-- App Manifest & Branding -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM HR">

  <!-- GSAP Library & Tools -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --accent: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b0f19 url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Overlay لضمان وضوح النصوص فوق الصورة */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.75);
      z-index: 0;
    }

    /* Intro Screen Overlay */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
      padding: 0 1rem;
      width: 100%;
    }

    .intro-title-container {
      display: flex;
      gap: 0.2rem;
      justify-content: center;
      align-items: center;
      direction: ltr;
    }

    .intro-char {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 800;
      color: #38bdf8;
      display: inline-block;
    }

    .intro-space { width: 0.5rem; }

    .intro-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.6rem, 5.2vw, 2.5rem);
      color: #38bdf8;
      opacity: 0;
      white-space: nowrap;
    }

    /* Header & Layout */
    .app-header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .lang-dropdown-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.75rem 1.5rem;
      border-radius: 1.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      width: 100%;
      margin-bottom: 0.85rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button.btn-primary {
      width: 100%; 
      padding: 0.95rem; 
      border-radius: 1.25rem; 
      border: none;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.btn-primary:active {
      transform: scale(0.98);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Intro Screen Overlay -->
  <div id="intro-screen">
    <div class="intro-content-wrapper">
      <div class="intro-title-container" id="introTitle"></div>
      <div class="intro-subtitle" id="introSubtitle">Partners in your child's growth Journey</div>
    </div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <div class="brand-logo-container">
      <img src="logo.png" alt="LM Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">LM HR</div>
    </div>
    <button class="lang-dropdown-btn">🌐 العربية</button>
  </div>

  <div class="container">
    <!-- Login View -->
    <div id="view-login" class="card">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.2rem;">LM HR Hub</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">بوابة الموظفين الرقمية</p>
      
      <div class="form-group">
        <label for="empCode">كود الموظف</label>
        <input type="text" id="empCode" placeholder="أدخل كود الموظف">
      </div>
      
      <div class="form-group">
        <label for="empPass">كلمة السر</label>
        <input type="password" id="empPass" placeholder="أدخل كلمة السر">
      </div>

      <button class="btn-primary" onclick="alert('تم تسجيل الدخول بنجاح')">دخول الحساب</button>
    </div>
  </div>

  <script>
    function runTornadoIntro() {
      const text = "LACTO MISR S.A.E";
      const container = document.getElementById('introTitle');
      const subtitle = document.getElementById('introSubtitle');
      const introScreen = document.getElementById('intro-screen');
      
      container.innerHTML = "";
      const charElements = [];

      for (let char of text) {
        if (char === ' ') {
          const space = document.createElement('span');
          space.className = 'intro-space';
          container.appendChild(space);
        } else {
          const span = document.createElement('span');
          span.className = 'intro-char';
          span.innerText = char;
          container.appendChild(span);
          charElements.push(span);
        }
      }

      // بداية الأنيميشن من الأفق
      charElements.forEach((el, index) => {
        gsap.set(el, { 
          y: -250, 
          x: (index - charElements.length / 2) * 25, 
          opacity: 0, 
          scale: 0.2,
          rotationY: 720 
        });
      });

      const tl = gsap.timeline();

      // 1. الدخول
      tl.to(charElements, { 
        duration: 2.0, 
        x: 0, 
        y: 0, 
        rotationY: 0,
        opacity: 1, 
        scale: 1, 
        stagger: 0.06, 
        ease: "power2.out" 
      })
      .to(subtitle, { duration: 1.0, opacity: 1, ease: "power2.out" }, "-=0.8")
      .to(subtitle, { duration: 0.8, opacity: 0 }, "+=1.2")
      
      // 2. الخروج للأعلى وتفعيل الصفحة
      .to(charElements, { 
        duration: 1.5, 
        y: -250, 
        x: (i) => (i - charElements.length / 2) * 25,
        rotationY: -720,
        opacity: 0, 
        scale: 0.2, 
        stagger: 0.04,
        ease: "power2.in",
        onComplete: () => {
          introScreen.classList.add('fade-out');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', runTornadoIntro);
  </script>
</body>
</html>
