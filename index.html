<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM HR Hub</title>
    <!-- مكتبة فايربيس (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- مكتبة QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
        .page { display: none; }
        .page.active { display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 300px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحة تسجيل الدخول -->
    <div id="view-login" class="page active">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="empCode" placeholder="كود الموظف">
        <input type="password" id="empPass" placeholder="كلمة السر">
        <div style="display: flex; align-items: center; gap: 5px; margin: 5px 0;">
            <input type="checkbox" id="rememberMe" style="width: auto; margin: 0;">
            <label for="rememberMe" style="font-size: 14px; cursor: pointer;">تذكرني</label>
        </div>
        <div id="error" class="error"></div>
        <button onclick="login(false)">دخول</button>
    </div>

    <!-- صفحة لوحة التحكم (Dashboard) -->
    <div id="view-dashboard" class="page">
        <h2>لوحة التحكم</h2>
        <p>مرحباً، <span id="userNameDisplay"></span></p>
        <div id="profileData"></div>
        <div id="qrcode" style="margin: 15px auto; display: flex; justify-content: center;"></div>
        
        <button onclick="openBiometricModal()" style="background: #28a745;">إعدادات بصمة الجهاز</button>
        <button onclick="logout()" style="background: #dc3545;">تسجيل خروج</button>
    </div>
</div>

<!-- نافذة إعدادات البصمة -->
<div id="biometricModal" class="modal">
    <div class="modal-content">
        <h3>تفعيل بصمة الجهاز</h3>
        <p style="font-size: 13px; color: #666;">اضغط لتأكيد ربط بصمة الجهاز (الإصبع أو الوجه) بحسابك.</p>
        <button onclick="enableBiometric()" style="background: #28a745;">تفعيل الآن</button>
        <button onclick="closeBiometricModal()" style="background: #6c757d;">إلغاء</button>
    </div>
</div>

<script>
    // إعدادات فايربيس (استبدلها ببيانات مشروعك الفعلية)
    const firebaseConfig = {
        databaseURL: "https://YOUR-DATABASE-URL.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentEmpCode = "";
    let currentUserData = null;
    let currentLang = "ar";

    // التحقق التلقائي عند فتح الصفحة لو كان هناك حساب مخزن
    window.onload = function() {
        const savedCode = localStorage.getItem('lacto_emp_code');
        const savedPass = localStorage.getItem('lacto_emp_pass');
        if (savedCode && savedPass) {
            document.getElementById('empCode').value = savedCode;
            document.getElementById('empPass').value = savedPass;
            document.getElementById('rememberMe').checked = true;
            login(true);
        }
    };

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    // دالة التحقق من بصمة الجهاز عند الدخول الفعلي
    async function verifyBiometricLogin(empCode) {
        if (!window.PublicKeyCredential) return true;
        
        const isBioEnabled = localStorage.getItem('lacto_bio_enabled_' + empCode);
        if (isBioEnabled !== 'true') return true; // لو مش مفعل البصمة يدخل عادي

        try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const credentialIdB64 = localStorage.getItem('lacto_bio_cred_' + empCode);
            let allowCredentials = [];
            
            if (credentialIdB64) {
                const rawId = Uint8Array.from(atob(credentialIdB64), c => c.charCodeAt(0));
                allowCredentials = [{
                    id: rawId,
                    type: 'public-key'
                }];
            }

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: challenge,
                    timeout: 60000,
                    userVerification: "required",
                    allowCredentials: allowCredentials.length > 0 ? allowCredentials : undefined
                }
            });

            return assertion !== null;
        } catch (err) {
            console.log("Biometric verification cancelled or failed:", err);
            return false;
        }
    }

    // دالة تسجيل الدخول الرئيسية
    async function login(isAuto = false) {
        const code = document.getElementById('empCode').value.trim();
        const pass = document.getElementById('empPass').value.trim();
        const remember = document.getElementById('rememberMe').checked;
        const errorEl = document.getElementById('error');
        
        errorEl.innerText = "جاري التحقق...";

        if (!code) { 
            errorEl.innerText = "يرجى إدخال كود Mوظف صالح"; 
            return; 
        }

        db.ref('users/' + code).once('value').then(async (snapshot) => {
            if (snapshot.exists()) {
                const user = snapshot.val();
                if (!isAuto && user.password !== pass) {
                    errorEl.innerText = "كلمة السر غير صحيحة!";
                    return;
                }

                // التحقق من البصمة الإجبارية إذا كانت مفعلة لهذا الموظف
                const bioEnabled = localStorage.getItem('lacto_bio_enabled_' + code);
                if (bioEnabled === 'true') {
                    errorEl.innerText = "يرجى تأكيد بصمة الجهاز للدخول...";
                    const verified = await verifyBiometricLogin(code);
                    if (!verified) {
                        errorEl.innerText = "فشل التحقق من البصمة أو تم إلغاؤها!";
                        return;
                    }
                }

                currentUserData = user;
                currentEmpCode = code;
                errorEl.innerText = "";

                if (remember || isAuto) {
                    localStorage.setItem('lacto_emp_code', code);
                    localStorage.setItem('lacto_emp_pass', user.password);
                } else {
                    localStorage.removeItem('lacto_emp_code');
                    localStorage.removeItem('lacto_emp_pass');
                }

                document.getElementById('userNameDisplay').innerText = user.name || code;
                document.getElementById('profileData').innerText = "الكود: " + code;

                const currentUrl = window.location.origin + window.location.pathname;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { 
                    text: currentUrl + "?emp=" + code, 
                    width: 85, 
                    height: 85 
                });

                showPage('view-dashboard');
            } else {
                errorEl.innerText = "كود الموظف غير مسجل!";
            }
        }).catch((err) => {
            console.error(err);
            errorEl.innerText = "حدث خطأ في الاتصال بقاعدة البيانات!";
        });
    }

    // دالة تفعيل البصمة وحفظ معرّف الكريدينشال
    async function enableBiometric() {
        closeBiometricModal();

        if (window.PublicKeyCredential && currentEmpCode) {
            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "LM HR Hub" },
                        user: {
                            id: Uint8Array.from(currentEmpCode, c => c.charCodeAt(0)),
                            name: currentEmpCode,
                            displayName: currentUserData ? currentUserData.name : "Employee"
                        },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        timeout: 60000,
                        authenticatorSelection: {
                            authenticatorAttachment: "platform",
                            userVerification: "required"
                        },
                        attestation: "direct"
                    }
                });

                localStorage.setItem('lacto_bio_enabled_' + currentEmpCode, 'true');
                
                const rawIdB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
                localStorage.setItem('lacto_bio_cred_' + currentEmpCode, rawIdB64);

                alert("تم ربط وتفعيل بصمة الجهاز بنجاح! الآن عند تسجيل الخروج والدخول مرة أخرى ستطلب منك البصمة.");
            } catch (e) {
                console.log("Biometric setup error:", e);
                alert("فشل إعداد البصمة، تأكد أن جهازك يدعم بصمة الإصبع أو الوجه.");
            }
        } else {
            alert("متصفحك لا يدعم البصمة الحيوية أو لم يتم تسجيل الدخول.");
        }
    }

    function openBiometricModal() {
        if(!currentEmpCode) {
            alert("يجيب تسجيل الدخول أولاً!");
            return;
        }
        document.getElementById('biometricModal').classList.add('show');
    }

    function closeBiometricModal() {
        document.getElementById('biometricModal').classList.remove('show');
    }

    function logout() {
        localStorage.removeItem('lacto_emp_code');
        localStorage.removeItem('lacto_emp_pass');
        currentEmpCode = "";
        currentUserData = null;
        document.getElementById('empCode').value = "";
        document.getElementById('empPass').value = "";
        document.getElementById('rememberMe').checked = false;
        showPage('view-login');
    }
</script>

</body>
</html>
