<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .company-name {
            font-size: 1.4rem; /* تم تصغير الخط ليكون مرتباً */
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .slogan {
            font-size: 0.9rem;
            color: #7f8c8d;
            animation: fadeInOut 2s infinite alternate;
        }
        @keyframes fadeInOut {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        
        /* الـ Slides الخاصة بالمرتب */
        .slides-container {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .slide-item {
            font-size: 1.1rem;
            font-weight: bold;
            color: #27ae60;
        }

        /* بوكس البصمة مع زرار الـ Swipe */
        .attendance-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        .attendance-times {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #555;
        }
        .swipe-track {
            background: #e0e0e0;
            height: 50px;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .swipe-text {
            font-size: 0.85rem;
            color: #888;
            position: absolute;
        }
        .swipe-btn {
            width: 55px;
            height: 44px;
            background: #3498db;
            border-radius: 22px;
            position: absolute;
            left: 3px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        /* الشات التفاعلي */
        .chat-section {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .chat-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .chat-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="company-name">الشركة الهندسية للتطوير الرقمي</div>
        <div class="slogan">نبتكر الحلول.. لنصنع المستقبل</div>
    </div>

    <!-- Slides المرتب -->
    <div class="slides-container">
        <div class="slide-item">💰 ملخص المرتب الصافي: 12,500 ج.م</div>
    </div>

    <!-- بوكس البصمة الجديد بنظام الـ Swipe -->
    <div class="attendance-box">
        <div class="attendance-times">
            <span>التسجيل: <strong>08:00 ص</strong></span>
            <span>الانصراف: <strong>04:00 م</strong></span>
        </div>
        <div class="swipe-track" id="swipeTrack">
            <span class="swipe-text">اسحب يمين للدخول ← | → اسحب شمال للخروج</span>
            <div class="swipe-btn" id="swipeBtn"> بصمة </div>
        </div>
    </div>

    <!-- الشات التفاعلي -->
    <div class="chat-section">
        <div class="chat-title">المساعد الذكي (الشات)</div>
        <div class="chat-box" id="chatBox">
            أهلاً بك! أنا هنا لمساعدتك، اسألني عما تريده...
        </div>
    </div>

    <script>
        // محاكاة بسيطة لحركة زر السحب (Swipe Interaction)
        const btn = document.getElementById('swipeBtn');
        const track = document.getElementById('swipeTrack');
        
        let isDragging = false;
        let startX = 0;

        btn.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let moveX = e.clientX - startX;
            let maxMove = track.clientWidth - btn.clientWidth - 6;
            
            if (moveX > 0 && moveX <= maxMove) {
                btn.style.transform = `translateX(${moveX}px)`;
                if (moveX > maxMove / 2) {
                    btn.style.backgroundColor = '#2ecc71'; // أخضر للدخول
                    btn.innerText = 'دخول';
                }
            } else if (moveX < 0 && Math.abs(moveX) <= maxMove) {
                btn.style.transform = `translateX(${moveX}px)`;
                if (Math.abs(moveX) > maxMove / 2) {
                    btn.style.backgroundColor = '#e74c3c'; // أحمر للخروج
                    btn.innerText = 'خروج';
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            // إعادة الزر مكانه بسلامة
            btn.style.transform = 'translateX(0px)';
            btn.style.backgroundColor = '#3498db';
            btn.innerText = 'بصمة';
        });
    </script>

</body>
</html>
