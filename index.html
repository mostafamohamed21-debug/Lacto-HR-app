<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacto HR Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      border-radius: 0.5rem;
      border: 1px solid var(--muted);
      background: #334155;
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .resigned { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .hidden { display: none; }
    .admin-panel {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--muted);
    }
    #loading { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-view">
      <h2>Lacto HR Hub</h2>
      <p style="color: var(--muted);">أدخل كود الموظف للدخول</p>
      <input type="text" id="empCode" placeholder="مثال: 102">
      <button onclick="login()">تسجيل الدخول</button>
      <p id="error" style="color: var(--danger); margin-top: 1rem;"></p>
    </div>

    <!-- شاشة الملف الشخصي -->
    <div id="profile-view" class="hidden">
      <h2 id="userName">--</h2>
      <p id="userJob" style="color: var(--muted);">--</p>
      <p id="userDept" style="color: var(--muted);">--</p>
      <div id="userStatus" class="status-badge">--</div>

      <!-- لوحة خاصة بالمديرين فقط -->
      <div id="manager-section" class="admin-panel hidden">
        <h3 style="color: var(--accent);">لوحة الإدارة 🔐</h3>
        <p>مرحباً بك في لوحة تحكم الإدارة</p>
      </div>

      <button onclick="logout()" style="margin-top: 1.5rem; background: var(--muted); color: #fff;">خروج</button>
    </div>
  </div>

  <!-- Firebase CDN SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // بيانات ربط مشروعك الفعلي بـ Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBObCeo4PM20UNYObThwdY4UaOiIhWdXa0",
      authDomain: "lacto-hr-system.firebaseapp.com",
      databaseURL: "https://lacto-hr-system-default-rtdb.firebaseio.com",
      projectId: "lacto-hr-system",
      storageBucket: "lacto-hr-system.firebasestorage.app",
      messagingSenderId: "671259800401",
      appId: "1:671259800401:web:905e1a36adba52ba2d1970"
    };

    const app = initializeApp(firebaseConfig);
    const dbRef = ref(getDatabase(app));

    window.login = async function() {
      const code = document.getElementById('empCode').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.innerText = "جاري التحقق من قاعدة البيانات...";

      if (!code) {
        errorEl.innerText = "برجاء كتابة كود الموظف";
        return;
      }

      try {
        const snapshot = await get(child(dbRef, `users/${code}`));
        if (snapshot.exists()) {
          const user = snapshot.val();
          
          if (user.status === "Resigned") {
            errorEl.innerText = "عفواً، هذا الحساب غير نشط (مستقيل).";
            return;
          }

          // تسجيل الدخول بنجاح
          errorEl.innerText = "";
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('profile-view').classList.remove('hidden');

          document.getElementById('userName').innerText = user.name;
          document.getElementById('userJob').innerText = user.job;
          document.getElementById('userDept').innerText = user.dept;
          
          const statusEl = document.getElementById('userStatus');
          statusEl.innerText = user.status === "Active" ? "حساب نشط" : "غير نشط";
          statusEl.className = `status-badge ${user.status.toLowerCase()}`;

          // إظهار لوحة المدير إذا كان Role = Manager
          if (user.role === "Manager") {
            document.getElementById('manager-section').classList.remove('hidden');
          } else {
            document.getElementById('manager-section').classList.add('hidden');
          }

        } else {
          errorEl.innerText = "كود الموظف غير موجود!";
        }
      } catch (err) {
        console.error(err);
        errorEl.innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
      }
    };

    window.logout = function() {
      document.getElementById('profile-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('empCode').value = '';
    };

    // تسجيل الـ Service Worker للـ PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
