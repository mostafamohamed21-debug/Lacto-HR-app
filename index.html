<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM HR">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- GSAP Library for Smooth Tornado Physics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --accent: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --success: #10b981;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.85)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      perspective: 1000px;
      overflow-x: hidden;
    }

    /* Tornado Intro Styling */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(11, 15, 25, 0.92), rgba(11, 15, 25, 0.96)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      perspective: 1200px;
      overflow: hidden;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .intro-content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .intro-title-container {
      width: 100%;
      display: flex;
      gap: 0.15rem;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      direction: ltr;
      padding: 0 0.5rem;
      transform-style: preserve-3d;
      text-align: center;
    }

    .intro-char {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.5rem, 5.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      display: inline-block;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .intro-space {
      width: 0.5rem;
    }

    .intro-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      opacity: 0;
      letter-spacing: 1.5px;
      will-change: opacity, transform;
    }

    /* Main App Layout */
    .app-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }

    .lang-dropdown-container {
      position: relative;
    }

    .lang-dropdown-btn {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .lang-dropdown-btn:active {
      transform: scale(0.92) translateZ(-5px);
    }

    .lang-dropdown-menu {
      position: absolute;
      top: 115%;
      left: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: none;
      z-index: 200;
      min-width: 130px;
      backdrop-filter: blur(16px);
    }

    [dir="rtl"] .lang-dropdown-menu { left: auto; right: 0; }
    .lang-dropdown-menu.show { display: block; }

    .lang-option {
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-option:hover {
      background: rgba(2, 132, 199, 0.3);
      color: #38bdf8;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.75rem 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      margin: 0.5rem 0;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px var(--accent-glow), inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .password-container {
      position: relative;
      width: 100%;
      margin: 0.5rem 0;
    }

    .password-container input {
      margin: 0;
      padding-left: 3rem;
    }

    [dir="rtl"] .password-container input {
      padding-left: 1rem;
      padding-right: 3rem;
    }

    .toggle-password {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0.2rem;
      width: 40px;
      background: none;
      border: none;
      box-shadow: none !important;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 10;
    }

    [dir="rtl"] .toggle-password {
      left: auto;
      right: 0.2rem;
    }

    .toggle-password:hover {
      color: #38bdf8;
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      pointer-events: none;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.5rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
      margin: 0;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 0.95rem;
      border-radius: 1.25rem;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.85rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 0 #024e77, 0 12px 20px rgba(0, 0, 0, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.3);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #024e77, 0 5px 10px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .bio-quick-btn {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 8px 0 #115e59, 0 12px 20px rgba(13, 148, 136, 0.3), inset 0 2px 2px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .bio-quick-btn:active {
      box-shadow: 0 2px 0 #115e59, 0 5px 10px rgba(13, 148, 136, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 8px 0 #991b1b, 0 12px 20px rgba(220, 38, 38, 0.3), inset 0 2px 2px rgba(255, 255, 255, 0.3);
    }

    .hidden { display: none !important; }

    .user-header-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.25rem;
      border-radius: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      text-align: right;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    [dir="ltr"] .user-header-card { text-align: left; }

    .header-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      object-fit: cover;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
      perspective: 1000px;
    }

    .service-btn {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.85));
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 4px 0 rgba(2, 132, 199, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .service-btn:hover {
      border-color: #38bdf8;
      transform: translateY(-6px) rotateX(8deg) scale(1.02);
      box-shadow: 0 18px 30px rgba(2, 132, 199, 0.35), 0 8px 0 rgba(2, 132, 199, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .service-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 1.2rem;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(2, 132, 199, 0.1));
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    .service-icon-box svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .service-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .back-btn {
      background: rgba(51, 65, 85, 0.8);
      border: 1px solid var(--border-color);
      width: auto;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      margin: 0;
      box-shadow: 0 4px 0 #1e293b, 0 6px 10px rgba(0,0,0,0.3);
      border-radius: 0.85rem;
    }

    .id-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 1.5rem;
      padding: 1.5rem;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
    }

    .id-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      object-fit: cover;
      margin: 0 auto 0.75rem auto;
      display: block;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      text-align: right;
      background: rgba(11, 15, 25, 0.7);
      padding: 0.85rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border-color);
    }

    [dir="ltr"] .info-grid { text-align: left; }

    .info-label { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.1rem; }
    .info-val { font-weight: 700; color: var(--text); }

    .qr-container {
      background: #ffffff;
      padding: 0.65rem;
      border-radius: 1rem;
      display: inline-block;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="intro-screen">
    <div class="intro-content-wrapper">
      <div class="intro-title-container" id="introTitle"></div>
      <div class="intro-subtitle" id="introSubtitle">بوابة الموظفين والمدراء الرقمية</div>
    </div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <div class="brand-container">
      <img src="logo.png" alt="LM HR Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-title">LM HR</div>
    </div>
    
    <div class="lang-dropdown-container">
      <button class="lang-dropdown-btn" onclick="toggleLangMenu()">
        🌐 <span id="current-lang-text">العربية</span> ▼
      </button>
      <div class="lang-dropdown-menu" id="langMenu">
        <div class="lang-option" onclick="selectLanguage('ar')">🇪🇬 العربية</div>
        <div class="lang-option" onclick="selectLanguage('en')">🇬🇧 English</div>
      </div>
    </div>
  </div>

  <div class="container">
    
    <!-- 1. Login View -->
    <div id="view-login" class="card">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.2rem;">LM HR Hub</h2>
      <p id="t-subtitle" style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">بوابة الموظفين والمدراء الرقمية</p>
      
      <input type="text" id="empCode" placeholder="كود الموظف">
      
      <div class="password-container">
        <input type="password" id="empPass" placeholder="كلمة السر">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
      </div>

      <label class="checkbox-container">
        <input type="checkbox" id="rememberMe">
        <span id="t-remember">تذكرني</span>
      </label>
      
      <button id="t-loginBtn" onclick="login()">دخول الحساب</button>

      <button id="bioQuickBtn" class="bio-quick-btn hidden" onclick="biometricQuickLogin()">
        <span id="t-bioQuickText">دخول سريع بالبصمة</span>
      </button>

      <p id="error" style="color: var(--danger); margin-top: 1rem; font-size: 0.85rem; font-weight: bold;"></p>
    </div>

    <!-- 2. Dashboard View -->
    <div id="view-dashboard" class="hidden">
      <div class="user-header-card">
        <img id="dash-avatar" class="header-avatar" src="" alt="Avatar">
        <div>
          <h3 id="dash-name" style="margin: 0; font-size: 1.1rem; font-weight: 700;">--</h3>
          <p id="dash-job" style="margin: 0; color: #38bdf8; font-size: 0.85rem;">--</p>
        </div>
      </div>

      <div class="services-grid">
        <div class="service-btn" onclick="showPage('view-id-card')">
          <div class="service-icon-box">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
          </div>
          <span id="t-btnID" class="service-title">كارت الهوية</span>
        </div>

        <div class="service-btn" onclick="showPage('view-leaves')">
          <div class="service-icon-box">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
          </div>
          <span id="t-btnLeaves" class="service-title">طلبات الإجازات</span>
        </div>
      </div>

      <button id="t-logoutBtn" onclick="logout()" class="btn-danger">تسجيل الخروج</button>
    </div>

    <!-- 3. ID Card View -->
    <div id="view-id-card" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" id="t-backBtn1" onclick="showPage('view-dashboard')">← رجوع</button>
        <span id="t-cardTitle" style="font-weight: 700; font-size: 0.9rem;">الكارت الرقمي</span>
      </div>

      <div class="id-card" id="myCardToDownload">
        <div class="id-card-header">
          <span style="font-weight: 800; font-size: 0.85rem; color: #38bdf8; letter-spacing: 1px;">LACTO MISR S.A.E</span>
          <span style="font-size: 0.65rem; background: rgba(2, 132, 199, 0.4); border: 1px solid var(--accent); color: #38bdf8; padding: 0.15rem 0.5rem; border-radius: 0.5rem; font-weight: 600;">VERIFIED</span>
        </div>
        <img id="userPhoto" class="profile-img" crossorigin="anonymous" src="" alt="User">
        <h3 id="userName" style="margin:0 0 0.2rem 0; font-size: 1.1rem;">--</h3>
        <p id="userJob" style="color: #38bdf8; font-size: 0.85rem; margin:0 0 0.85rem 0;">--</p>
        
        <div class="info-grid">
          <div><div class="info-label" id="t-lblDept">الإدارة</div><div id="userDept" class="info-val">--</div></div>
          <div><div class="info-label" id="t-lblCode">كود الموظف</div><div id="userCodeVal" class="info-val">--</div></div>
          <div style="grid-column: span 2;"><div class="info-label" id="t-lblNID">الرقم القومي</div><div id="userNID" class="info-val">--</div></div>
        </div>

        <div class="qr-container"><div id="qrcode"></div></div>
      </div>

      <button id="t-saveCardBtn" onclick="downloadCard()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">حفظ الكارت كصورة</button>
    </div>

  </div>

  <script>
    // قاعدة بيانات الموظفين - مضاف بها الموظف رقم "2" لمنع الخطأ
    const employeeDatabase = [
      {
        code: "2",
        pass: "123456",
        name: "محمد عبد السلام",
        job: "مدير قسم الموارد البشرية",
        dept: "الموارد البشرية",
        nid: "29011021408899",
        photo: "https://via.placeholder.com/150/0284c7/ffffff?text=LM+HR"
      },
      {
        code: "1",
        pass: "123456",
        name: "أحمد محمود علي",
        job: "مهندس نظم ومعلومات",
        dept: "تكنولوجيا المعلومات",
        nid: "29508121401234",
        photo: "https://via.placeholder.com/150/0284c7/ffffff?text=LM+HR"
      }
    ];

    let currentUserData = null;

    // دالة الدخول المعدلة بدون أي مشكلة مطابقة
    function login() {
      const codeInput = document.getElementById('empCode').value.toString().trim();
      const passInput = document.getElementById('empPass').value.toString().trim();
      const errEl = document.getElementById('error');
      errEl.textContent = '';

      if (!codeInput || !passInput) {
        errEl.textContent = 'برجاء إدخال كود الموظف وكلمة السر!';
        return;
      }

      // البحث عن الموظف بتحويل الكود لنص ممسوح المسافات
      const foundUser = employeeDatabase.find(emp => emp.code.toString().trim() === codeInput);

      if (!foundUser) {
        errEl.textContent = 'كود الموظف غير مسجل!';
        return;
      }

      if (foundUser.pass !== passInput) {
        errEl.textContent = 'كلمة السر غير صحيحة!';
        return;
      }

      // النجاح وتسجيل الدخول
      currentUserData = foundUser;
      populateUserData(currentUserData);

      if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('lm_saved_code', codeInput);
      }

      showPage('view-dashboard');
    }

    function populateUserData(data) {
      document.getElementById('dash-name').textContent = data.name;
      document.getElementById('dash-job').textContent = data.job;
      document.getElementById('dash-avatar').src = data.photo;

      document.getElementById('userName').textContent = data.name;
      document.getElementById('userJob').textContent = data.job;
      document.getElementById('userDept').textContent = data.dept;
      document.getElementById('userCodeVal').textContent = data.code;
      document.getElementById('userNID').textContent = data.nid;
      document.getElementById('userPhoto').src = data.photo;

      const qrTarget = document.getElementById('qrcode');
      qrTarget.innerHTML = '';
      new QRCode(qrTarget, {
        text: `LM-HR:${data.code}:${data.nid}`,
        width: 100,
        height: 100,
        colorDark: "#0b0f19",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('empPass');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    }

    function showPage(pageId) {
      const pages = ['view-login', 'view-dashboard', 'view-id-card'];
      pages.forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    function logout() {
      currentUserData = null;
      document.getElementById('empPass').value = '';
      showPage('view-login');
    }

    function downloadCard() {
      const cardContainer = document.getElementById('myCardToDownload');
      html2canvas(cardContainer, { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `LM_HR_Card_${currentUserData.code}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedCode = localStorage.getItem('lm_saved_code');
      if (savedCode) {
        document.getElementById('empCode').value = savedCode;
        document.getElementById('rememberMe').checked = true;
      }
      setTimeout(() => {
        document.getElementById('intro-screen').classList.add('fade-out');
      }, 1000);
    });
  </script>
</body>
</html>
