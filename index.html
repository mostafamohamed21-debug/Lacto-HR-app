<!-- 6. Directory View -->
    <div id="view-directory" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')"><span class="t-backText">← رجوع</span></button>
        <span id="t-dirTitle" style="font-weight: 700;">دليل التواصل</span>
      </div>
      <p id="t-dirDesc" style="color: var(--muted); font-size: 0.85rem; padding: 1rem 0;">أرقام الطوارئ والعيادة الطبية ومكتب الموارد البشرية.</p>
    </div>

  </div> <!-- نهاية الـ container -->

  <!-- JavaScript Functions Skeleton -->
  <script>
    let currentLang = 'ar';

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passInput = document.getElementById('empPass');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }

    // Toggle Language Dropdown
    function toggleLangMenu(e) {
      e.stopPropagation();
      document.getElementById('langMenu').classList.toggle('show');
    }

    // Switch Language
    function selectLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('current-lang-text').innerText = lang === 'ar' ? 'العربية' : 'English';
      document.getElementById('langMenu').classList.remove('show');
    }

    // Navigation function
    function showPage(pageId) {
      const views = ['view-login', 'view-dashboard', 'view-id-card', 'view-leaves', 'view-payroll', 'view-directory'];
      views.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(pageId);
      if (target) target.classList.remove('hidden');
    }

    // Dummy Login Function
    function login() {
      const code = document.getElementById('empCode').value;
      const pass = document.getElementById('empPass').value;
      
      if(code && pass) {
        document.getElementById('dash-code-val').innerText = code;
        document.getElementById('userCodeVal').innerText = code;
        showPage('view-dashboard');
      } else {
        document.getElementById('error').innerText = 'يرجى إدخال كود الموظف وكلمة السر';
      }
    }

    // GPS Check-in Simulation
    function verifyLocationAndCheckIn() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const statusText = document.getElementById('checkinStatusText');
          statusText.innerText = "تم تسجيل حضورك بنجاح!";
          statusText.classList.add('success');
        }, () => {
          alert("تعذر الوصول إلى الموقع الجغرافي. يرجى تفعيل الـ GPS.");
        });
      }
    }

    // Hide Intro Screen after animation
    window.addEventListener('load', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        if(intro) intro.classList.add('fade-out');
      }, 2000);
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', () => {
      const menu = document.getElementById('langMenu');
      if (menu) menu.classList.remove('show');
    });
  </script>
</body>
</html>
