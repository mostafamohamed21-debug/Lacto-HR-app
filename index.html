<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lacto Misr - HR Portal</title>
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #ef4444;
      --success: #10b981;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 1rem 5rem 1rem;
    }

    .app-header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
    }

    .lang-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.3rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: #030712;
      color: var(--text);
      font-size: 0.9rem;
      text-align: right;
      outline: none;
    }
    [dir="ltr"] input { text-align: left; }
    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.7rem;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }

    .hidden { display: none !important; }

    /* Dashboard UI */
    .profile-box {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #1f2937;
      padding: 0.8rem;
      border-radius: 0.8rem;
      margin-bottom: 1rem;
      text-align: right;
    }
    [dir="ltr"] .profile-box { text-align: left; }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: #1f2937;
      padding: 0.8rem;
      border-radius: 0.8rem;
      text-align: center;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; }
    .stat-val { font-size: 1rem; font-weight: 800; color: var(--accent); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 400px;
      background: #0b0f19;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem;
      z-index: 1000;
    }
    .nav-tab {
      background: transparent;
      border: none;
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
    }
    .nav-tab svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-tab.active {
      color: var(--accent);
      background: rgba(2, 132, 199, 0.1);
    }

    /* Chat UI */
    .chat-box {
      height: 200px;
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      padding: 0.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      text-align: right;
    }
    [dir="ltr"] .chat-box { text-align: left; }
    .chat-msg { max-width: 80%; padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.8rem; }
    .chat-msg.me { background: var(--accent); align-self: flex-start; color: #fff; }
    [dir="ltr"] .chat-msg.me { align-self: flex-end; }
    .chat-msg.hr { background: #1f2937; align-self: flex-end; color: var(--muted); }
    [dir="ltr"] .chat-msg.hr { align-self: flex-start; }

    .policy-row {
      background: #1f2937;
      padding: 0.8rem;
      border-radius: 0.7rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      text-align: right;
    }
    [dir="ltr"] .policy-row { text-align: left; }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <div class="brand-title" id="brandTitle">LACTO MISR HR</div>
    <div class="header-actions">
      <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">EN / عربي</button>
    </div>
  </div>

  <div class="container">
    
    <!-- 1. Login View -->
    <div id="view-login" class="card">
      <h2 style="font-size: 1.2rem; margin-bottom: 0.3rem;" id="l-title">تسجيل الدخول</h2>
      <p style="color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem;" id="l-sub">أدخل بيانات الموظف للمتابعة</p>
      
      <input type="text" id="empCode" placeholder="كود الموظف">
      <input type="password" id="empPass" placeholder="كلمة السر">
      
      <button onclick="login()" id="l-btn">دخول</button>
      <p id="error" style="color: var(--danger); margin-top: 0.5rem; font-size: 0.8rem; font-weight: bold;"></p>
    </div>

    <!-- 2. Dashboard View -->
    <div id="view-dashboard" class="card hidden">
      <div class="profile-box">
        <img id="dash-avatar" class="avatar" src="" alt="Profile">
        <div>
          <h3 id="dash-name" style="font-size: 0.95rem; font-weight: 700;">--</h3>
          <p id="dash-job" style="color: var(--accent); font-size: 0.75rem;">--</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label" id="s-leave">رصيد الإجازات</div>
          <div class="stat-val" id="val-leave">21 يوم</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" id="s-perm">الأذونات</div>
          <div class="stat-val" id="val-perm">3 / 3</div>
        </div>
      </div>

      <button onclick="logout()" class="btn-danger" id="l-out">تسجيل الخروج</button>
    </div>

    <!-- 3. ID Card View -->
    <div id="view-id" class="card hidden">
      <h3 style="margin-bottom: 0.8rem; color: var(--accent); font-size: 1rem;" id="id-head">هوية الموظف</h3>
      <div style="background: #030712; border: 1px solid var(--border); border-radius: 0.8rem; padding: 1rem;" id="idCardBox">
        <div style="font-size:0.75rem; color:var(--accent); font-weight:bold; margin-bottom:0.5rem;">LACTO MISR S.A.E</div>
        <img id="idPhoto" style="width:70px; height:70px; border-radius:50%; border:2px solid var(--accent); object-fit:cover; margin:0 auto 0.5rem auto; display:block;" src="" alt="User">
        <h4 id="idName" style="margin:0; font-size:0.9rem;">--</h4>
        <p id="idJob" style="color:var(--accent); font-size:0.75rem; margin:0 0 0.5rem 0;">--</p>
        <div id="qrcode" style="background:#fff; padding:0.3rem; border-radius:0.4rem; display:inline-block;"></div>
      </div>
      <button onclick="downloadCard()" style="background: var(--success); margin-top: 0.8rem;" id="id-save">حفظ الهوية كصورة</button>
    </div>

    <!-- 4. Policies View -->
    <div id="view-policies" class="card hidden">
      <h3 style="margin-bottom: 0.8rem; color: var(--accent); font-size: 1rem;" id="p-head">لوائح الشركة</h3>
      
      <div class="policy-row">
        <div>
          <div style="font-weight:700; font-size:0.8rem;" id="p-1-t">لائحة العمل الداخلية</div>
          <div style="font-size:0.7rem; color:var(--muted);" id="p-1-s">نسخة معتمدة (PDF)</div>
        </div>
        <button style="width:auto; padding:0.4rem 0.8rem; font-size:0.75rem; margin:0;" onclick="alert('Downloading...')">PDF</button>
      </div>

      <div class="policy-row">
        <div>
          <div style="font-weight:700; font-size:0.8rem;" id="p-2-t">سياسة الإجازات</div>
          <div style="font-size:0.7rem; color:var(--muted);" id="p-2-s">دليل الموظف الشامل</div>
        </div>
        <button style="width:auto; padding:0.4rem 0.8rem; font-size:0.75rem; margin:0;" onclick="alert('Downloading...')">PDF</button>
      </div>
    </div>

    <!-- 5. Chat View -->
    <div id="view-chat" class="card hidden">
      <h3 style="margin-bottom: 0.6rem; color: var(--accent); font-size: 1rem;" id="c-head">محادثة الـ HR</h3>
      <div class="chat-box" id="chatBox">
        <div class="chat-msg hr" id="c-wel">أهلاً بك، كيف يمكننا مساعدتك اليوم؟</div>
      </div>
      <div style="display:flex; gap:0.4rem;">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك..." style="margin:0;">
        <button onclick="sendMsg()" style="width: auto; margin:0; padding: 0 1rem;" id="c-send">إرسال</button>
      </div>
    </div>

  </div>

  <!-- Bottom Nav Tabs -->
  <div class="bottom-nav hidden" id="bottomNav">
    <button class="nav-tab active" id="tab-btn-dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span id="t-home">الرئيسية</span>
    </button>
    <button class="nav-tab" id="tab-btn-id" onclick="switchTab('id')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
      <span id="t-id">الهوية</span>
    </button>
    <button class="nav-tab" id="tab-btn-policies" onclick="switchTab('policies')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span id="t-pol">السياسات</span>
    </button>
    <button class="nav-tab" id="tab-btn-chat" onclick="switchTab('chat')">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      <span id="t-chat">الدعم</span>
    </button>
  </div>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyBObCeo4PM20UNYObThwdY4UaOiIhWdXa0",
      authDomain: "lacto-hr-system.firebaseapp.com",
      databaseURL: "https://lacto-hr-system-default-rtdb.firebaseio.com",
      projectId: "lacto-hr-system"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentEmpCode = "";
    let isArabic = true;

    function toggleLanguage() {
      isArabic = !isArabic;
      if (!isArabic) {
        document.documentElement.setAttribute('dir', 'ltr');
        document.getElementById('brandTitle').innerText = "LACTO MISR HR";
        document.getElementById('l-title').innerText = "Sign In";
        document.getElementById('l-sub').innerText = "Enter employee details to continue";
        document.getElementById('empCode').placeholder = "Employee Code";
        document.getElementById('empPass').placeholder = "Password";
        document.getElementById('l-btn').innerText = "Sign In";
        document.getElementById('s-leave').innerText = "Leave Balance";
        document.getElementById('s-perm').innerText = "Permissions";
        document.getElementById('l-out').innerText = "Sign Out";
        document.getElementById('id-head').innerText = "Employee ID Card";
        document.getElementById('id-save').innerText = "Save ID as Image";
        document.getElementById('p-head').innerText = "Company Policies";
        document.getElementById('p-1-t').innerText = "Internal Labor Law";
        document.getElementById('p-1-s').innerText = "Certified Copy (PDF)";
        document.getElementById('p-2-t').innerText = "Leave Policy";
        document.getElementById('p-2-s').innerText = "Comprehensive Guide";
        document.getElementById('c-head').innerText = "HR Support";
        document.getElementById('c-wel').innerText = "Welcome! How can we assist you today?";
        document.getElementById('chatInput').placeholder = "Type a message...";
        document.getElementById('c-send').innerText = "Send";
        document.getElementById('t-home').innerText = "Home";
        document.getElementById('t-id').innerText = "ID Card";
        document.getElementById('t-pol').innerText = "Policies";
        document.getElementById('t-chat').innerText = "Support";
      } else {
        document.documentElement.setAttribute('dir', 'rtl');
        document.getElementById('brandTitle').innerText = "LACTO MISR HR";
        document.getElementById('l-title').innerText = "تسجيل الدخول";
        document.getElementById('l-sub').innerText = "أدخل بيانات الموظف للمتابعة";
        document.getElementById('empCode').placeholder = "كود الموظف";
        document.getElementById('empPass').placeholder = "كلمة السر";
        document.getElementById('l-btn').innerText = "دخول";
        document.getElementById('s-leave').innerText = "رصيد الإجازات";
        document.getElementById('s-perm').innerText = "الأذونات";
        document.getElementById('l-out').innerText = "تسجيل الخروج";
        document.getElementById('id-head').innerText = "هوية الموظف";
        document.getElementById('id-save').innerText = "حفظ الهوية كصورة";
        document.getElementById('p-head').innerText = "لوائح الشركة";
        document.getElementById('p-1-t').innerText = "لائحة العمل الداخلية";
        document.getElementById('p-1-s').innerText = "نسخة معتمدة (PDF)";
        document.getElementById('p-2-t').innerText = "سياسة الإجازات";
        document.getElementById('p-2-s').innerText = "دليل الموظف الشامل";
        document.getElementById('c-head').innerText = "محادثة الـ HR";
        document.getElementById('c-wel').innerText = "أهلاً بك، كيف يمكننا مساعدتك اليوم؟";
        document.getElementById('chatInput').placeholder = "اكتب رسالتك...";
        document.getElementById('c-send').innerText = "إرسال";
        document.getElementById('t-home').innerText = "الرئيسية";
        document.getElementById('t-id').innerText = "الهوية";
        document.getElementById('t-pol').innerText = "السياسات";
        document.getElementById('t-chat').innerText = "الدعم";
      }
    }

    function switchTab(tabId) {
      const views = ['dashboard', 'id', 'policies', 'chat'];
      views.forEach(id => {
        const el = document.getElementById('view-' + id);
        if (el) el.classList.add('hidden');
      });

      const target = document.getElementById('view-' + tabId);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function login() {
      const code = document.getElementById('empCode').value.trim();
      const pass = document.getElementById('empPass').value.trim();
      const err = document.getElementById('error');
      if (!code) { err.innerText = isArabic ? "أدخل كود الموظف" : "Enter employee code"; return; }

      db.ref('users/' + code).once('value').then(snap => {
        if (snap.exists()) {
          const user = snap.val();
          if (user.password !== pass) { err.innerText = isArabic ? "كلمة السر خطأ!" : "Incorrect password!"; return; }
          currentEmpCode = code;

          document.getElementById('dash-name').innerText = user.name || "Employee";
          document.getElementById('dash-job').innerText = user.job || "System Specialist";
          document.getElementById('dash-avatar').src = user.photo || "https://i.pravatar.cc/150?img=11";

          document.getElementById('idName').innerText = user.name || "Employee";
          document.getElementById('idJob').innerText = user.job || "System Specialist";
          document.getElementById('idPhoto').src = user.photo || "https://i.pravatar.cc/150?img=11";

          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById("qrcode"), { text: "LM-ID-" + code, width: 70, height: 70 });

          document.getElementById('view-login').classList.add('hidden');
          document.getElementById('bottomNav').classList.remove('hidden');
          switchTab('dashboard');
        } else {
          err.innerText = isArabic ? "الكود غير موجود!" : "Code not found!";
        }
      });
    }

    function downloadCard() {
      html2canvas(document.getElementById('idCardBox'), { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'ID_' + currentEmpCode + '.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div class="chat-msg me">${text}</div>`;
      input.value = "";
      box.scrollTop = box.scrollHeight;
    }

    function logout() {
      window.location.reload();
    }
  </script>
</body>
</html>
