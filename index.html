<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM HR">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Share+Tech+Mono&display=swap');
    
    :root {
      --bg-dark: #0b1329;
      --navy-blue: #1e3a8a;
      --mid-blue: #0284c7;
      --baby-blue: #38bdf8;
      --glow-blue: #7dd3fc;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --danger: #ef4444;
      --success: #10b981;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top center, #101f3c 0%, #0b1329 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 6rem 1rem;
      overflow-x: hidden;
    }

    /* Intro Screen */
    #intro-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #101f3c 0%, #0b1329 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; overflow: hidden; transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }
    #intro-screen.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-title { font-size: 1.8rem; font-weight: 800; color: var(--baby-blue); text-shadow: 0 0 20px var(--baby-blue); }

    /* App Header */
    .app-header {
      width: 100vw; background: rgba(11, 19, 41, 0.95); padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-bottom: 1px solid var(--border-color); backdrop-filter: blur(12px);
    }
    body { padding-top: 4.5rem; }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--baby-blue); text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 1.5rem; border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    input, textarea {
      width: 100%; padding: 0.9rem 1rem; margin: 0.4rem 0; border-radius: 1rem;
      border: 1px solid var(--border-color); background: rgba(11, 19, 41, 0.8);
      color: var(--text); font-size: 0.95rem; outline: none; text-align: right;
    }
    [dir="ltr"] input, [dir="ltr"] textarea { text-align: left; }

    /* --- DIGITAL COUNTER CARD --- */
    .digital-quota-card {
      background: linear-gradient(135deg, #0b1329 0%, #1e3a8a 40%, #0284c7 75%, #38bdf8 100%);
      border: 1px solid var(--glow-blue);
      border-radius: 1.75rem;
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 15px 35px rgba(2, 132, 199, 0.35), inset 0 0 20px rgba(125, 211, 252, 0.3);
      position: relative;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .quota-label {
      font-size: 0.85rem; font-weight: 700; color: #e0f2fe; margin-bottom: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .digital-clock-display {
      display: flex; justify-content: center; align-items: center; gap: 0.4rem; direction: ltr;
    }
    .time-unit-box {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(11, 19, 41, 0.75); border: 1px solid var(--glow-blue);
      border-radius: 0.85rem; padding: 0.5rem 0.75rem; min-width: 70px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    .digit-val {
      font-family: 'Share Tech Mono', monospace; font-size: 1.8rem; font-weight: 800;
      color: var(--glow-blue); text-shadow: 0 0 12px var(--baby-blue); line-height: 1;
    }
    .digit-sub { font-size: 0.65rem; color: #bae6fd; margin-top: 0.3rem; font-weight: 600; }
    .clock-separator { font-family: 'Share Tech Mono', monospace; font-size: 1.8rem; color: var(--glow-blue); text-shadow: 0 0 10px var(--baby-blue); animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* --- PERMISSION TYPE SELECTOR --- */
    .permission-type-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.75rem 0;
    }
    .type-btn {
      background: rgba(30, 58, 138, 0.3); border: 1px solid var(--border-color);
      border-radius: 1.25rem; padding: 0.85rem 0.5rem; color: var(--text);
      font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    }
    .type-btn.active {
      background: linear-gradient(135deg, var(--navy-blue) 0%, var(--mid-blue) 100%);
      border-color: var(--baby-blue); color: #fff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4); transform: scale(1.02);
    }

    /* --- ANDROID-STYLE WHEEL TIME PICKERS --- */
    .picker-section-title { font-size: 0.8rem; color: var(--muted); text-align: right; margin-top: 0.5rem; }
    [dir="ltr"] .picker-section-title { text-align: left; }
    
    .time-picker-card {
      background: linear-gradient(135deg, rgba(11, 19, 41, 0.9) 0%, rgba(30, 58, 138, 0.4) 100%);
      border: 1px solid var(--border-color); border-radius: 1.25rem; padding: 0.75rem;
      margin-top: 0.4rem; display: flex; align-items: center; justify-content: space-around;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }
    .wheel-container { display: flex; align-items: center; gap: 0.3rem; direction: ltr; }
    .wheel-scroll-box {
      height: 90px; width: 55px; overflow-y: scroll; scroll-snap-type: y mandatory;
      scrollbar-width: none; border-radius: 0.6rem; background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3); text-align: center; position: relative;
    }
    .wheel-scroll-box::-webkit-scrollbar { display: none; }
    .wheel-item {
      height: 30px; line-height: 30px; font-size: 0.95rem; font-weight: 700;
      color: var(--muted); scroll-snap-align: center; transition: all 0.2s;
    }
    .wheel-item.selected { color: var(--baby-blue); font-size: 1.15rem; font-weight: 800; text-shadow: 0 0 8px var(--baby-blue); }

    .duration-result-box {
      background: rgba(56, 189, 248, 0.12); border: 1px solid var(--baby-blue);
      border-radius: 1rem; padding: 0.75rem; text-align: center; font-weight: 800;
      color: var(--baby-blue); font-size: 0.9rem; margin-top: 0.75rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    button.btn-primary {
      width: 100%; padding: 0.95rem; border-radius: 1.25rem; border: none;
      background: linear-gradient(135deg, var(--mid-blue) 0%, var(--baby-blue) 100%);
      color: #0b1329; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 1rem;
      box-shadow: 0 8px 0 #0284c7, 0 12px 25px rgba(56, 189, 248, 0.3); transition: all 0.15s ease;
    }
    button.btn-primary:active { transform: translateY(6px); box-shadow: 0 2px 0 #0284c7; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .back-btn {
      background: rgba(30, 58, 138, 0.6); border: 1px solid var(--border-color); color: var(--text);
      padding: 0.4rem 0.9rem; border-radius: 0.8rem; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <div class="brand-title">LM HR HUB</div>
    <button class="back-btn" onclick="alert('الرجوع للرئيسية')">🏠 الرئيسية</button>
  </div>

  <div class="container">
    <div class="card">
      
      <!-- 1. العداد الديجيتال الكبير -->
      <div class="digital-quota-card">
        <div class="quota-label" data-ar="المتبقي من الرصيد الشهري للأذونات" data-en="Monthly Permission Balance">المتبقي من الرصيد الشهري للأذونات</div>
        <div class="digital-clock-display">
          <div class="time-unit-box">
            <span class="digit-val" id="cntHours">04</span>
            <span class="digit-sub" data-ar="ساعة" data-en="Hours">ساعة</span>
          </div>
          <span class="clock-separator">:</span>
          <div class="time-unit-box">
            <span class="digit-val" id="cntMins">00</span>
            <span class="digit-sub" data-ar="دقيقة" data-en="Mins">دقيقة</span>
          </div>
          <span class="clock-separator">:</span>
          <div class="time-unit-box">
            <span class="digit-val" id="cntSecs">00</span>
            <span class="digit-sub" data-ar="ثانية" data-en="Secs">ثانية</span>
          </div>
        </div>
      </div>

      <!-- 2. نوع الإذن -->
      <div class="picker-section-title" data-ar="حدد نوع الإذن المطلوب:" data-en="Select Permission Type:">حدد نوع الإذن المطلوب:</div>
      <div class="permission-type-grid">
        <div class="type-btn active" id="btnTypeLate" onclick="setPermissionType('late_arrival')">
          <span style="font-size:1.2rem;">🌅</span>
          <span data-ar="تأخير صباحي" data-en="Morning Late">تأخير صباحي</span>
        </div>
        <div class="type-btn" id="btnTypeEarly" onclick="setPermissionType('early_leave')">
          <span style="font-size:1.2rem;">🌆</span>
          <span data-ar="انصراف مبكر" data-en="Early Departure">انصراف مبكر</span>
        </div>
      </div>
      <input type="hidden" id="permTypeVal" value="late_arrival">

      <!-- 3. منتقي الوقت الحديث (Android Wheel Picker Style) -->
      <!-- وقت البداية -->
      <div class="picker-section-title" data-ar="من الساعة:" data-en="From Time:">من الساعة:</div>
      <div class="time-picker-card">
        <div class="wheel-container">
          <!-- Hours Wheel -->
          <div class="wheel-scroll-box" id="fromHourWheel" onscroll="handleWheelScroll('fromHourWheel', 'fromHourVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item selected">08</div><div class="wheel-item">09</div><div class="wheel-item">10</div>
            <div class="wheel-item">11</div><div class="wheel-item">12</div><div class="wheel-item">01</div>
            <div class="wheel-item">02</div><div class="wheel-item">03</div><div class="wheel-item">04</div>
            <div class="wheel-item"></div>
          </div>
          <span style="color:var(--baby-blue); font-weight:800;">:</span>
          <!-- Minutes Wheel -->
          <div class="wheel-scroll-box" id="fromMinWheel" onscroll="handleWheelScroll('fromMinWheel', 'fromMinVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item selected">00</div><div class="wheel-item">15</div>
            <div class="wheel-item">30</div><div class="wheel-item">45</div>
            <div class="wheel-item"></div>
          </div>
          <!-- AM/PM Wheel -->
          <div class="wheel-scroll-box" id="fromAmpmWheel" onscroll="handleWheelScroll('fromAmpmWheel', 'fromAmpmVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item selected">ص</div><div class="wheel-item">م</div>
            <div class="wheel-item"></div>
          </div>
        </div>
      </div>

      <!-- وقت النهاية -->
      <div class="picker-section-title" data-ar="إلى الساعة:" data-en="To Time:" style="margin-top:0.75rem;">إلى الساعة:</div>
      <div class="time-picker-card">
        <div class="wheel-container">
          <!-- Hours Wheel -->
          <div class="wheel-scroll-box" id="toHourWheel" onscroll="handleWheelScroll('toHourWheel', 'toHourVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item">08</div><div class="wheel-item selected">09</div><div class="wheel-item">10</div>
            <div class="wheel-item">11</div><div class="wheel-item">12</div><div class="wheel-item">01</div>
            <div class="wheel-item">02</div><div class="wheel-item">03</div><div class="wheel-item">04</div>
            <div class="wheel-item"></div>
          </div>
          <span style="color:var(--baby-blue); font-weight:800;">:</span>
          <!-- Minutes Wheel -->
          <div class="wheel-scroll-box" id="toMinWheel" onscroll="handleWheelScroll('toMinWheel', 'toMinVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item selected">00</div><div class="wheel-item">15</div>
            <div class="wheel-item">30</div><div class="wheel-item">45</div>
            <div class="wheel-item"></div>
          </div>
          <!-- AM/PM Wheel -->
          <div class="wheel-scroll-box" id="toAmpmWheel" onscroll="handleWheelScroll('toAmpmWheel', 'toAmpmVal')">
            <div class="wheel-item"></div>
            <div class="wheel-item selected">ص</div><div class="wheel-item">م</div>
            <div class="wheel-item"></div>
          </div>
        </div>
      </div>

      <!-- قيم الأوقات المختارة المخفية -->
      <input type="hidden" id="fromHourVal" value="08"><input type="hidden" id="fromMinVal" value="00"><input type="hidden" id="fromAmpmVal" value="ص">
      <input type="hidden" id="toHourVal" value="09"><input type="hidden" id="toMinVal" value="00"><input type="hidden" id="toAmpmVal" value="ص">

      <!-- 4. شاشة حساب مدة الإذن تلقائياً -->
      <div class="duration-result-box" id="durationResultText">
        ⏱️ مدة الإذن المطلوبة: 1 ساعة و 0 دقيقة
      </div>

      <!-- ملاحظات -->
      <textarea id="permissionNotes" rows="2" placeholder="سبب الإذن / ملاحظات إضافية..." style="margin-top:0.75rem; resize:none;"></textarea>

      <!-- 5. زر التأكيد -->
      <button class="btn-primary" onclick="submitPermissionRequest()">🚀 تأكيد وإرسال طلب الإذن</button>
      <p id="permMsg" style="font-size: 0.85rem; margin-top: 0.6rem; font-weight: 800;"></p>

    </div>
  </div>

  <script>
    // إجمالي الرصيد بالثواني (4 ساعات = 14400 ثانية)
    let totalBalanceSeconds = 14400;

    function updateDigitalClockDisplay(seconds) {
      let h = Math.floor(seconds / 3600);
      let m = Math.floor((seconds % 3600) / 60);
      let s = seconds % 60;

      document.getElementById('cntHours').innerText = String(h).padStart(2, '0');
      document.getElementById('cntMins').innerText = String(m).padStart(2, '0');
      document.getElementById('cntSecs').innerText = String(s).padStart(2, '0');
    }

    function setPermissionType(type) {
      document.getElementById('permTypeVal').value = type;
      if (type === 'late_arrival') {
        document.getElementById('btnTypeLate').classList.add('active');
        document.getElementById('btnTypeEarly').classList.remove('active');
      } else {
        document.getElementById('btnTypeEarly').classList.add('active');
        document.getElementById('btnTypeLate').classList.remove('active');
      }
    }

    // التحكم في سكرول بكرة الوقت على طريقة الأندرويد
    function handleWheelScroll(wheelId, targetInputId) {
      const wheel = document.getElementById(wheelId);
      const items = wheel.querySelectorAll('.wheel-item');
      const scrollTop = wheel.scrollTop;
      const itemHeight = 30;
      
      let selectedIndex = Math.round(scrollTop / itemHeight) + 1;
      if (selectedIndex < 1) selectedIndex = 1;
      if (selectedIndex >= items.length - 1) selectedIndex = items.length - 2;

      items.forEach((item, idx) => {
        if (idx === selectedIndex) {
          item.classList.add('selected');
          document.getElementById(targetInputId).value = item.innerText.trim();
        } else {
          item.classList.remove('selected');
        }
      });

      calculateRequestedDuration();
    }

    // حساب المدة الزمنية تلقائياً
    function calculateRequestedDuration() {
      let fH = parseInt(document.getElementById('fromHourVal').value) || 8;
      let fM = parseInt(document.getElementById('fromMinVal').value) || 0;
      let fAp = document.getElementById('fromAmpmVal').value;

      let tH = parseInt(document.getElementById('toHourVal').value) || 9;
      let tM = parseInt(document.getElementById('toMinVal').value) || 0;
      let tAp = document.getElementById('toAmpmVal').value;

      // تحويل لنظام 24 ساعة
      if (fAp === 'م' && fH < 12) fH += 12;
      if (fAp === 'ص' && fH === 12) fH = 0;

      if (tAp === 'م' && tH < 12) tH += 12;
      if (tAp === 'ص' && tH === 12) tH = 0;

      let startTotalMins = fH * 60 + fM;
      let endTotalMins = tH * 60 + tM;

      let diffMins = endTotalMins - startTotalMins;

      const resultBox = document.getElementById('durationResultText');

      if (diffMins <= 0) {
        resultBox.style.color = '#ef4444';
        resultBox.style.borderColor = '#ef4444';
        resultBox.innerText = '⚠️ وقت النهاية يجب أن يكون بعد وقت البداية!';
        return 0;
      }

      let durHours = Math.floor(diffMins / 60);
      let durMins = diffMins % 60;

      resultBox.style.color = '#38bdf8';
      resultBox.style.borderColor = '#38bdf8';
      resultBox.innerText = `⏱️ مدة الإذن المطلوبة: ${durHours} ساعة و ${durMins} دقيقة`;

      return diffMins;
    }

    function submitPermissionRequest() {
      const diffMins = calculateRequestedDuration();
      const msg = document.getElementById('permMsg');

      if (diffMins <= 0) {
        msg.style.color = '#ef4444';
        msg.innerText = 'يرجى ضبط الوقت بطريقة صحيحة!';
        return;
      }

      let reqSeconds = diffMins * 60;
      if (reqSeconds > totalBalanceSeconds) {
        msg.style.color = '#ef4444';
        msg.innerText = '❌ مدة الإذن تتجاوز رصيدك المتبقي الشهرى!';
        return;
      }

      // خصم الوقت المأخوذ وتحديث العداد الديجيتال
      totalBalanceSeconds -= reqSeconds;
      updateDigitalClockDisplay(totalBalanceSeconds);

      msg.style.color = '#10b981';
      msg.innerText = '✅ تم تسجيل الإذن وتأكيده بنجاح!';
    }

    // تشغيل العداد لأول مرة
    window.addEventListener('DOMContentLoaded', () => {
      updateDigitalClockDisplay(totalBalanceSeconds);
      calculateRequestedDuration();
    });
  </script>
</body>
</html>
