<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <!-- App Manifest & Branding -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM HR">

  <!-- GSAP Library & Tools -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Great+Vibes&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --accent: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b0f19;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem 1rem;
      overflow-x: hidden;
    }

    /* Intro Screen Overlay */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
      padding: 0 1rem;
      width: 100%;
    }

    .intro-title-container {
      display: flex;
      gap: 0.2rem;
      justify-content: center;
      align-items: center;
      direction: ltr;
    }

    .intro-char {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 800;
      color: #38bdf8;
      display: inline-block;
    }

    .intro-space { width: 0.5rem; }

    .intro-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.6rem, 5.2vw, 2.5rem);
      color: #38bdf8;
      opacity: 0;
      white-space: nowrap;
    }

    /* Header & Layout */
    .app-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .lang-dropdown-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.75rem 1.5rem;
      border-radius: 1.5rem;
      text-align: center;
    }

    .form-group {
      width: 100%;
      margin-bottom: 0.85rem;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    button.btn-primary {
      width: 100%; 
      padding: 0.95rem; 
      border-radius: 1.25rem; 
      border: none;
      background: #0284c7;
      color: #fff; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="intro-screen">
    <div class="intro-content-wrapper">
      <div class="intro-title-container" id="introTitle"></div>
      <div class="intro-subtitle" id="introSubtitle">Partners in your child's growth Journey</div>
    </div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <div class="brand-title">LM HR</div>
    <button class="lang-dropdown-btn">🌐 العربية</button>
  </div>

  <div class="container">
    <!-- Login View -->
    <div id="view-login" class="card">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.2rem;">LM HR Hub</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">بوابة الموظفين الرقمية</p>
      
      <div class="form-group">
        <input type="text" id="empCode" placeholder="كود الموظف">
      </div>
      
      <div class="form-group">
        <input type="password" id="empPass" placeholder="كلمة السر">
      </div>

      <button class="btn-primary" onclick="alert('تم تسجيل الدخول بنجاح')">دخول الحساب</button>
    </div>
  </div>

  <script>
    // Tornado Intro Logic (Fixed & Guaranteed)
    function runTornadoIntro() {
      const text = "LACTO MISR S.A.E";
      const container = document.getElementById('introTitle');
      const subtitle = document.getElementById('introSubtitle');
      const introScreen = document.getElementById('intro-screen');
      
      container.innerHTML = "";
      const charElements = [];

      for (let char of text) {
        if (char === ' ') {
          const space = document.createElement('span');
          space.className = 'intro-space';
          container.appendChild(space);
        } else {
          const span = document.createElement('span');
          span.className = 'intro-char';
          span.innerText = char;
          container.appendChild(span);
          charElements.push(span);
        }
      }

      // ضبط البداية: الأحرف نازلة من فوق حافة الشاشة
      charElements.forEach((el, index) => {
        gsap.set(el, { 
          y: -300, 
          x: (index - charElements.length / 2) * 30, 
          opacity: 0, 
          scale: 0.2,
          rotationY: 720 
        });
      });

      const tl = gsap.timeline();

      // 1. الدخول البطيء من الأعلى
      tl.to(charElements, { 
        duration: 2.2, 
        x: 0, 
        y: 0, 
        rotationY: 0,
        opacity: 1, 
        scale: 1, 
        stagger: 0.08, 
        ease: "power2.out" 
      })
      .to(subtitle, { duration: 1.2, opacity: 1, ease: "power2.out" }, "-=1.0")
      .to(subtitle, { duration: 1.0, opacity: 0 }, "+=1.5")
      
      // 2. الخروج بنفس الطريقة نحو الأعلى
      .to(charElements, { 
        duration: 1.8, 
        y: -300, 
        x: (i) => (i - charElements.length / 2) * 30,
        rotationY: -720,
        opacity: 0, 
        scale: 0.2, 
        stagger: 0.05,
        ease: "power2.in",
        onComplete: () => {
          // إخفاء الـ Intro نهائياً لإظهار الصفحة
          introScreen.classList.add('fade-out');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', runTornadoIntro);
  </script>
</body>
</html>
