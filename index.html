<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <!-- App Manifest & Branding (LM HR & Logo) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LM HR">
  <link class="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- GSAP Library for Smooth Tornado Physics -->
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <!-- Firebase Scripts -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <style>
    @import url('https://googleapis.com');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --accent: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --danger: #ef4444;
      --success: #10b981;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.85)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      perspective: 1000px;
      overflow-x: hidden;
    }

    /* Tornado Intro Styling */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(11, 15, 25, 0.92), rgba(11, 15, 25, 0.96)), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      perspective: 1200px;
      overflow: hidden;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .intro-content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .intro-title-container {
      width: 100%;
      display: flex;
      gap: 0.15rem;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      direction: ltr;
      padding: 0 0.5rem;
      transform-style: preserve-3d;
      text-align: center;
    }

    .intro-char {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.5rem, 5.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      display: inline-block;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .intro-space {
      width: 0.5rem;
    }

    .intro-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      opacity: 0;
      letter-spacing: 1.5px;
      will-change: opacity, transform;
    }

    /* Main App Layout */
    .app-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }

    .lang-dropdown-container {
      position: relative;
    }

    .lang-dropdown-btn {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .lang-dropdown-btn:active {
      transform: scale(0.92) translateZ(-5px);
    }

    .lang-dropdown-menu {
      position: absolute;
      top: 115%;
      left: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: none;
      z-index: 200;
      min-width: 130px;
      backdrop-filter: blur(16px);
    }

    [dir="rtl"] .lang-dropdown-menu { left: auto; right: 0; }
    .lang-dropdown-menu.show { display: block; }

    .lang-option {
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-option:hover {
      background: rgba(2, 132, 199, 0.3);
      color: #38bdf8;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1.75rem 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      margin: 0.5rem 0;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px var(--accent-glow), inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .password-container {
      position: relative;
      width: 100%;
      margin: 0.5rem 0;
    }

    .password-container input {
      margin: 0;
      padding-left: 3rem;
    }

    [dir="rtl"] .password-container input {
      padding-left: 1rem;
      padding-right: 3rem;
    }

    .toggle-password {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0.2rem;
      width: 40px;
      background: none;
      border: none;
      box-shadow: none !important;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 10;
    }

    [dir="rtl"] .toggle-password {
      left: auto;
      right: 0.2rem;
    }

    .toggle-password:hover {
      color: #38bdf8;
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      pointer-events: none;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.5rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }

    [dir="rtl"] .checkbox-container {
      justify-content: flex-start;
    }

    .checkbox-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
      margin: 0;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 0.95rem;
      border-radius: 1.25rem;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.85rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 0 #024e77, 0 12px 20px rgba(0, 0, 0, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.3);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #024e77, 0 5px 10px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .bio-quick-btn {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 8px 0 #115e59, 0 12px 20px rgba(13, 148, 136, 0.3), inset 0 2px 2px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
