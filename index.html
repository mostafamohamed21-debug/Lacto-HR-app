<!-- تعديل واجهة التطبيق - Header & Sign In Card -->
<div class="app-header">
    <div class="user-profile">
        <img src="profile.jpg" alt="Profile" class="avatar">
        <div class="user-info">
            <span class="greeting">Good Afternoon</span>
            <h3 class="username">Omar Khaled <span class="id-tag">ID: 286</span></h3>
        </div>
    </div>
    
    <!-- الأزرار العلوية (الإشعارات + الرسائل بالنافذة المنبثقة) -->
    <div class="header-actions">
        <!-- زر الإشعارات -->
        <button class="notification-btn" aria-label="Notifications">
            <svg class="icon-bell" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            <span class="badge"></span>
        </button>

        <!-- زر الرسائل بالنافذة المنبثقة (تم إرجاعه كما طلبْت) -->
        <div class="messages-dropdown-container">
            <button class="messages-btn" id="messagesToggle" aria-label="Messages">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </button>
            <div class="messages-popup" id="messagesPopup" style="display: none;">
                <div class="popup-header">
                    <h4>الرسائل</h4>
                    <span class="close-popup">&times;</span>
                </div>
                <div class="popup-body">
                    <p>لا توجد رسائل جديدة حالياً.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- الكارت الترحيبي (Sign In Card) بالعرض الكامل والبصمة في المنتصف تماماً -->
<div class="sign-in-card-full">
    <div class="sign-in-content">
        <div class="title-section">
            <span class="main-title">Sign In</span>
        </div>
        <div class="sub-info">
            <div class="info-item">
                <span class="label">Working Hours</span>
                <span class="value">00:00</span>
            </div>
            <div class="info-item">
                <span class="label">Out</span>
                <span class="value">00:00</span>
            </div>
            <div class="info-item">
                <span class="label">In</span>
                <span class="value">00:00</span>
            </div>
        </div>
    </div>
    
    <!-- مربع البصمة في منتصف الكارت تماماً -->
    <div class="fingerprint-section-center">
        <div class="fingerprint-box">
            <svg viewBox="0 0 24 24"><path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 13.88 3 12 3c-1.88 0-3.66.42-5.58 1.41-.15.08-.33.04-.41-.11-.08-.15-.04-.33.11-.41C8.42 2.83 10.38 2.4 12 2.4c1.62 0 3.58.43 5.48 1.49.15.08.2.27.11.41-.05.09-.14.17-.28.17zM12 5.8c-1.56 0-3.05.35-4.42 1.01-.15.07-.33 0-.4-.15-.07-.15 0-.33.15-.4C8.83 5.66 10.38 5.3 12 5.3c1.62 0 3.17.36 4.67 1.06.15.07.22.25.15.4-.07.15-.25.22-.4.15-1.37-.66-2.86-1.01-4.42-1.01zm4.6 3.3c-.09 0-.18-.04-.24-.11C15.44 8.35 13.78 8 12 8c-1.78 0-3.44.35-4.96 1.09-.15.07-.33 0-.4-.15-.07-.15 0-.33.15-.4C8.42 7.78 10.15 7.4 12 7.4c1.85 0 3.58.38 5.09 1.14.14.07.2.25.13.4-.05.09-.14.16-.22.16zm-4.6 3.08c-1.1 0-2.1.25-3.03.73-.14.07-.31.01-.38-.13-.07-.14-.01-.31.13-.38 1.01-.52 2.11-.8 3.28-.8 1.17 0 2.27.28 3.28.8.14.07.2.24.13.38-.07.14-.24.2-.38.13-.93-.48-1.93-.73-3.03-.73zm0 2.92c-.55 0-1.08.11-1.58.34-.14.06-.3 0-.36-.14-.06-.14 0-.3.14-.36.56-.25 1.14-.38 1.8-.38.66 0 1.24.13 1.8.38.14.06.2.22.14.36-.06.14-.22.2-.36.14-.5-.23-1.03-.34-1.58-.34z"/></svg>
        </div>
    </div>
</div>

<style>
/* تنسيق الكارت ليمتد بالعرض الكامل */
.sign-in-card-full {
    width: 100%;
    background: #00c853; /* اللون الأخضر الخاص بالتصميم */
    border-radius: 24px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    margin-top: 15px;
}
.fingerprint-section-center {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #00e676;
    border-radius: 50%;
    padding: 15px;
}
.messages-popup {
    position: absolute;
    right: 20px;
    top: 60px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    width: 250px;
    z-index: 1000;
    padding: 15px;
}
</style>
