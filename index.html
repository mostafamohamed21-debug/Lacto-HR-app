<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM HR - Lacto HR Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="logo.png">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.9);
      --border-color: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: #0b0f19;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4.5rem 1rem 5rem 1rem;
      direction: rtl;
    }
    .app-header {
      width: 100%; max-width: 420px; background: #0d1527; padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      position: fixed; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color);
    }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 1.5rem; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    input, select, textarea {
      width: 100%; padding: 0.8rem; margin: 0.4rem 0; border-radius: 0.8rem;
      border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.9);
      color: var(--text); font-size: 0.95rem; outline: none; text-align: right;
    }
    button {
      width: 100%; padding: 0.85rem; border-radius: 0.8rem; border: none;
      background: #0284c7; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 0.5rem;
    }
    .btn-danger { background: var(--danger); }
    .hidden { display: none !important; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .back-btn { background: #334155; padding: 0.4rem 0.9rem; font-size: 0.8rem; width: auto; border-radius: 0.6rem; }
    .service-btn {
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 1rem; border-radius: 1rem; color: var(--text); font-weight: 700;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 0.5rem; width: 100%;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-title">LM HR Hub</div>
    <button onclick="logout()" style="width: auto; padding: 0.3rem 0.6rem; font-size: 0.75rem; background: var(--danger);">خروج</button>
  </div>

  <div class="container">
    <!-- 1. شاشة تسجيل الدخول -->
    <div id="view-login" class="card">
      <h2 style="margin-bottom: 1rem; color: var(--accent);">تسجيل الدخول</h2>
      <input type="text" id="empCode" placeholder="كود الموظف">
      <input type="password" id="empPass" placeholder="كلمة السر">
      <button onclick="login()">دخول</button>
      <p id="error" style="color: var(--danger); margin-top: 0.5rem; font-size: 0.85rem; text-align: center;"></p>
    </div>

    <!-- 2. لوحة التحكم الرئيسية -->
    <div id="view-dashboard" class="card hidden">
      <h3 id="dash-name" style="color: var(--accent); margin-bottom: 0.5rem;">أهلاً بك</h3>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;">إدارة موارد بشركة لاكتو مصر</p>
      
      <button onclick="showPage('view-services')" class="service-btn">
        <span>📅 الخدمات والطلبات</span>
        <span>➔</span>
      </button>
      <button onclick="showPage('view-id-card')" class="service-btn">
        <span>🆔 الكارت الرقمي (ID)</span>
        <span>➔</span>
      </button>
    </div>

    <!-- 3. شاشة الخدمات -->
    <div id="view-services" class="card hidden">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')">← رجوع</button>
        <span style="font-weight: 700; color: var(--accent);">الخدمات المتاحة</span>
      </div>
      
      <!-- استخدام Select عادي خالص ومضمون 100% بدون أي مشاكل في الموبايل -->
      <div style="margin-bottom: 1rem;">
        <label style="font-size: 0.8rem; color: var(--muted);">اختر نوع الطلب:</label>
        <select id="mainServiceSelect" onchange="handleServiceChange()">
          <option value="leave">طلب إجازة</option>
          <option value="permission">طلب إذن شخصي</option>
          <option value="loan">طلب سلفة مالية</option>
          <option value="payslip">طلب مفردات مرتب</option>
        </select>
      </div>

      <div id="serviceFormContainer">
        <!-- نموذج إجازة افتراضي -->
        <div id="form-leave">
          <label style="font-size: 0.75rem; color: var(--muted);">نوع الإجازة:</label>
          <select id="leaveType">
            <option value="annual">إجازة سنوية</option>
            <option value="casual">إجازة عارضة</option>
            <option value="sick">إجازة مرضية</option>
          </select>
          <button onclick="alert('تم إرسال الطلب بنجاح!')">إرسال الطلب</button>
        </div>
      </div>
    </div>

    <!-- 4. الكارت الرقمي -->
    <div id="view-id-card" class="card hidden" style="text-align: center;">
      <div class="nav-bar">
        <button class="back-btn" onclick="showPage('view-dashboard')">← رجوع</button>
        <span style="font-weight: 700; color: var(--accent);">الكارت الرقمي</span>
      </div>
      <h3 id="cardName" style="margin: 0.5rem 0;">--</h3>
      <p id="cardJob" style="color: var(--accent); font-size: 0.85rem; margin-bottom: 1rem;">--</p>
      <div id="qrcode" style="background: #fff; padding: 1rem; display: inline-block; border-radius: 0.8rem;"></div>
    </div>
  </div>

  <script>
    // إعدادات فايربيس الأساسية
    const firebaseConfig = {
      apiKey: "AIzaSyBObCeo4PM20UNYObThwdY4UaOiIhWdXa0",
      authDomain: "lacto-hr-system.firebaseapp.com",
      databaseURL: "https://lacto-hr-system-default-rtdb.firebaseio.com",
      projectId: "lacto-hr-system"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let currentUser = null;

    function showPage(pageId) {
      document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    function login() {
      const code = document.getElementById('empCode').value.trim();
      const pass = document.getElementById('empPass').value.trim();
      const errorEl = document.getElementById('error');

      if (!code || !pass) {
        errorEl.innerText = "يرجى إدخال الكود وكلمة السر";
        return;
      }

      db.ref('users/' + code).once('value').then(snapshot => {
        if (snapshot.exists()) {
          const user = snapshot.val();
          if (user.password === pass) {
            currentUser = user;
            errorEl.innerText = "";
            document.getElementById('dash-name').innerText = "أهلاً بك، " + user.name;
            document.getElementById('cardName').innerText = user.name;
            document.getElementById('cardJob').innerText = user.job || "موظف";
            
            // توليد كود الـ QR
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: "EMP-" + code, width: 100, height: 100 });
            
            showPage('view-dashboard');
          } else {
            errorEl.innerText = "كلمة السر غير صحيحة!";
          }
        } else {
          errorEl.innerText = "كود الموظف غير مسجل!";
        }
      }).catch(err => {
        errorEl.innerText = "حدث خطأ في الاتصال بقاعدة البيانات";
      });
    }

    function logout() {
      currentUser = null;
      document.getElementById('empCode').value = "";
      document.getElementById('empPass').value = "";
      showPage('view-login');
    }

    function handleServiceChange() {
      const val = document.getElementById('mainServiceSelect').value;
      const container = document.getElementById('serviceFormContainer');
      if (val === 'leave') {
        container.innerHTML = `<label style="font-size: 0.75rem; color: var(--muted);">نوع الإجازة:</label><select><option>سنوية</option><option>عارضة</option></select><button onclick="alert('تم إرسال الطلب')">إرسال الطلب</button>`;
      } else if (val === 'permission') {
        container.innerHTML = `<label style="font-size: 0.75rem; color: var(--muted);">نوع الإذن:</label><select><option>تأخير صباحي</option><option>انصراف مبكر</option></select><button onclick="alert('تم إرسال طلب الإذن')">إرسال الطلب</button>`;
      } else {
        container.innerHTML = `<label style="font-size: 0.75rem; color: var(--muted);">تفاصيل الطلب:</label><input type="text" placeholder="اكتب التفاصيل هنا..."><button onclick="alert('تم إرسال الطلب')">إرسال الطلب</button>`;
      }
    }
  </script>
</body>
</html>
